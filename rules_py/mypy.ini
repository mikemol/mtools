#
# The house mypy config for this atom's own script, closing the gap W323 left (pytest_main.py fell
# out of the root's `files = ["*.py"]` when it moved here). Copied from the root pyproject's
# [tool.mypy] at W325. ⚑ mypy.ini, NOT pyproject.toml: the gates find distributions by
# `*/pyproject.toml`, and an atom is not one.
[mypy]
strict = True
extra_checks = True
strict_equality = True
disallow_any_decorated = True
disallow_any_explicit = True
disallow_any_expr = True
python_version = 3.13
warn_unused_ignores = True
warn_unreachable = True
enable_error_code = ignore-without-code, redundant-expr, truthy-bool
files = pytest_main.py
explicit_package_bases = True
