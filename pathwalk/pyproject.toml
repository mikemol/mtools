[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
# ⚑ THE DIRECTORY-OPERAND WALK extracted from mikemol-pycodemod (mtools:W573) so a caller without
# libcst can reuse it (mdstruct, mtools:W561). A library: no console script, standard library only.
name = "mikemol-pathwalk"
version = "0.1.0"
description = "Expand directory operands to their Python files, skipping registered git worktrees and virtual environments and counting what was left out."
readme = "README.md"
requires-python = ">=3.13"
authors = [{name = "Mike Mol"}]
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["walk", "worktree", "venv", "directory"]
classifiers = [
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

# ⚑ NO RUNTIME DEPENDENCY: standard library only.
dependencies = []

[project.urls]
Homepage = "https://github.com/mikemol/mtools"

[dependency-groups]
# ⚑ `mikemol-procrun` (W2222) IS DEV-ONLY: the witnesses that run `git` in a decoy repository reach
# it through the one stdlib-only seam instead of each spelling the subprocess rules in a per-file
# exemption. The runtime list above stays empty.
dev = ["pytest", "mypy", "ruff==0.16.6", "mikemol-procrun"]

[tool.setuptools.packages.find]
where = ["src"]
# ⚑⚑ NO `src/mikemol/__init__.py`: PEP 420 implicit namespace, shared with the siblings.
include = ["mikemol.*"]

[tool.setuptools.package-data]
"mikemol.pathwalk" = ["py.typed"]

[tool.uv]
environments = ["sys_platform == 'linux'"]

[tool.uv.sources]
mikemol-procrun = { path = "../procrun" }

[tool.pytest.ini_options]
empty_parameter_set_mark = "fail_at_collect"  # a parametrize that collects zero cases FAILS; it never reads as a skip (W88, arms in W90)
testpaths = ["tests"]
norecursedirs = ["bazel-*", ".venv", ".git", ".claude", "*.egg-info", "__pycache__"]  # backstop: with tests/ absent the runner falls back to rootdir and walks these (measured by linux-sources, W297)
addopts = "--strict-markers --strict-config"
markers = []

# ⚑⚑ THE SIBLINGS' FULL STRICT BLOCK, unchanged. See ratchet/pyproject.toml for why each key.
[tool.mypy]
strict = true
extra_checks = true
strict_equality = true
disallow_any_decorated = true
disallow_any_explicit = true
disallow_any_expr = true
python_version = "3.13"
warn_unused_ignores = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
files = ["src", "tests"]
mypy_path = "src"
explicit_package_bases = true

[tool.ruff]
line-length = 100
target-version = "py313"
namespace-packages = ["src/mikemol", "tests"]

[tool.ruff.lint]
preview = true
select = ["ALL"]
ignore = [
    "incorrect-blank-line-before-class",
    "multi-line-summary-second-line",
    "missing-trailing-comma",
    # ⚑ CODON REJECTS A BARE `*,` (mtools:W1340): the keyword-only marker that kept a boolean out of
    # the positional slot is gone, so the rules that demand it are off for this dist.
    "boolean-type-hint-positional-argument",
    "boolean-default-value-positional-argument",
]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = true

# ⚑⚑ COPIED FROM ratchet/pyproject.toml, which carries the P/F arms this pattern was measured by.
# A TOML literal string: in a basic string `\.` is an invalid escape.
[tool.ruff.lint.flake8-copyright]
notice-rgx = '(?i)SPDX-License-Identifier: Apache-2\.0[ \t]*\n#[ \t]*Copyright \(c\) \d{4} Mike Mol'

[tool.ruff.lint.isort]
known-third-party = ["mikemol.procrun"]

# ⚑⚑ `assert` IS THE TEST IDIOM, so it is granted to `tests/*` once. The tests that run `git` in a
# decoy repository do it through `procrun.capture` (W2222), so no test carries a subprocess entry.
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["assert"]
# ⚑ ONE FILE, ONE RESPONSIBILITY: walk exists to ASK GIT which paths are registered worktrees.
# The argv is fixed, the root is a path operand after `-C`, and git is resolved on PATH once.
"src/mikemol/pathwalk/walk.py" = ["suspicious-subprocess-import", "subprocess-without-shell-equals-true"]
