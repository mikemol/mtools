[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# ⚑⚑⚑ THE BASELINE SUBSTITUTED DEFAULTS. life's WhisperX one-off read a segment with
# `seg.get("start", 0.0)` and `seg.get("speaker", "UNKNOWN")`, so a segment with no timing printed
# as `[00:00]` beside real ones (.claude/design/W255-audiostruct.md). Asked for by life (life:W12).
# Stage 1 is `records`: every segment lands in exactly one record, and nothing is defaulted.
name = "mikemol-audiostruct"
version = "0.1.0"
description = "Transcription and diarization read so that nothing is defaulted: every WhisperX segment in exactly one record, unplaceable segments carried with a reason."
readme = "README.md"
requires-python = ">=3.13"
authors = [{name = "Mike Mol"}]
license = "Apache-2.0"
keywords = ["whisperx", "transcription", "diarization", "lossless"]
classifiers = [
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Typing :: Typed",
]

# ⚑ EMPTY ON PURPOSE: the record layer is plain parsed JSON and the standard library.
dependencies = []

# ⚑⚑ NO `[gpu]` EXTRA, ON PURPOSE (W275, operator 2026-09-28). The stage runner's real models are
# locked ONLY in requirements-gpu.txt, staged as the `audiostruct_gpu` bazel hub (W267). An extra
# here would land in uv.lock, and `@audiostruct_dev` is built from uv.lock, so the mutants
# .venv staged torch, whisperx and CUDA (about 8G) in every audiostruct build, in both output
# bases on the zram /var/tmp (measured: `bazel query deps(//audiostruct:.venv)` listed
# @audiostruct_dev//torch). The cost: `pip install mikemol-audiostruct[gpu]` is not offered;
# the GPU set installs from requirements-gpu.txt, whose header records how it was compiled.
# whisperx 3.7.0 through 3.8.6 require Python <3.14, so that lock is for py3.13, and so is
# this distribution's .venv (.python-version).
# ⚑⚑ THE HOST .venv CARRIES THE GPU SET OUT OF BAND (W274, operator 2026-09-28), because
# tests/test_stub_authority.py runs in pre-commit's host pytest leg and needs whisperx importable.
# `uv sync` PRUNES IT: after any sync, run `uv pip install --no-deps -r requirements-gpu.txt`, or
# the witness goes red (by design; it never skips). uv's cache is on /home, not the zram /var/tmp.
# `--no-deps` because the lock overrides whisperx's torch pins (W271, CUDA 13): re-resolving it
# without requirements-gpu-overrides.txt is unsatisfiable by construction.

[project.scripts]
mikemol-audio = "mikemol.audiostruct.main:main"

[project.urls]
Homepage = "https://github.com/mikemol/mtools"

[dependency-groups]
# ⚑ THE SAME THREE AS THE SIBLINGS, for the same reasons (see ratchet/pyproject.toml): mypy and
# pytest are staged by the bazel mypy action, and `.githooks/pre-commit` refuses without ruff.
dev = ["pytest", "mypy", "ruff==0.16.6"]

[tool.setuptools.packages.find]
where = ["src"]
# ⚑⚑ NO `src/mikemol/__init__.py` — PEP 420 implicit namespace, shared with the siblings.
include = ["mikemol.*"]

[tool.setuptools.package-data]
"mikemol.audiostruct" = ["py.typed"]

[tool.uv]
environments = ["sys_platform == 'linux'"]

[tool.pytest.ini_options]
empty_parameter_set_mark = "fail_at_collect"  # a parametrize that collects zero cases FAILS; it never reads as a skip (W88, arms in W90)
testpaths = ["tests"]
norecursedirs = ["bazel-*", ".venv", ".git", ".claude", "*.egg-info", "__pycache__"]  # backstop: with tests/ absent the runner falls back to rootdir and walks these (measured by linux-sources, W297)
addopts = "--strict-markers --strict-config"
# ⚑ NO MARKERS. Every input is synthetic and inline; nothing needs a host, a GPU or a skip.
markers = []

# ⚑⚑ THE SIBLINGS' FULL STRICT BLOCK, unchanged. See ratchet/pyproject.toml for why each key.
[tool.mypy]
strict = true
extra_checks = true
strict_equality = true
disallow_any_decorated = true
disallow_any_explicit = true
disallow_any_expr = true
python_version = "3.13"
warn_unused_ignores = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
files = ["src", "tests"]
# ⚑ `stubs` carries whisperx's typed surface (W268): whisperx ships no py.typed.
mypy_path = "src:stubs"
explicit_package_bases = true

[tool.ruff]
line-length = 100
target-version = "py313"
namespace-packages = ["src/mikemol", "tests"]

[tool.ruff.lint]
preview = true
select = ["ALL"]
ignore = ["incorrect-blank-line-before-class", "multi-line-summary-second-line", "missing-trailing-comma"]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = true

# ⚑⚑ COPIED FROM ratchet/pyproject.toml, which carries the P/F arms this pattern was measured by.
# A TOML literal string: in a basic string `\.` is an invalid escape.
[tool.ruff.lint.flake8-copyright]
notice-rgx = '(?i)SPDX-License-Identifier: Apache-2\.0[ \t]*\n#[ \t]*Copyright \(c\) \d{4} Mike Mol'

# ⚑⚑ PER FILE, NEVER A GLOB. A `tests/*` entry would grant the next test module an exemption
# nobody chose for it; each line below is one module that needs it.
[tool.ruff.lint.per-file-ignores]
"tests/test_records.py" = ["assert"]
"tests/test_render.py" = ["assert"]
"tests/test_stages.py" = ["assert"]
"tests/test_gpu.py" = ["assert"]
"tests/test_cli.py" = ["assert"]
"tests/test_whisperx_site.py" = ["assert", "suspicious-subprocess-import", "subprocess-without-shell-equals-true"]
"tests/test_main.py" = ["assert"]
# ⚑ main.py's RESPONSIBILITY is starting each stage as a process (design note D3/O1); its argv is
# built by cli.child_argv from parsed arguments, never a shell string.
"src/mikemol/audiostruct/main.py" = ["suspicious-subprocess-import", "subprocess-without-shell-equals-true"]
"tests/test_stub_authority.py" = ["assert", "suspicious-subprocess-import", "subprocess-without-shell-equals-true"]
# ⚑ stages.py's RESPONSIBILITY is catching every library error: any one it let through could print
# the Hugging Face token, so each is rewritten as StageError `from None` (design note D4).
"src/mikemol/audiostruct/stages.py" = ["blind-except"]
