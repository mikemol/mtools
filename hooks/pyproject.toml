[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# ⚑⚑⚑ THESE HOOKS ARE ALREADY ADOPTED ACROSS REPOS BY SYMLINK, AND THAT IS THE DEFECT THIS
# PACKAGE ENDS. A symlinked script derives its own root from `__file__` — and `abspath` does not
# resolve symlinks, so the root becomes the CONSUMER's repo. Measured: a peer's adopted tool
# failed on every invocation with `ModuleNotFoundError`, and the cause was neither their code nor
# a refactor but a latent property of being reached through a link. An installed package cannot
# have that defect: it knows where it lives, and it can DECLARE what it needs instead of hoping
# the surrounding layout supplies it.
name = "mikemol-hooks"
version = "0.1.0"
description = "PreToolUse hooks that refuse textual queries over structured artifacts, unstated mutations, shell composition, and un-linted Python edits."
readme = "README.md"
requires-python = ">=3.13"
authors = [{name = "Mike Mol"}]
license = "Apache-2.0"
keywords = ["hooks", "lint", "ruff", "mypy", "shellcheck", "pre-commit"]
classifiers = [
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]

# ⚑ THE CHECKERS ARE RUNTIME DEPENDENCIES, NOT DEV EXTRAS. This package's whole function is to
# invoke them; a consumer installing it without ruff and mypy gets a hook that reports
# `is not installed in the project venv` on every edit — armed and checking nothing, which is the
# state these hooks exist to make impossible.
#
# ⚑⚑ AND `shellcheck` IS ABSENT FROM THIS LIST BECAUSE IT IS A SYSTEM BINARY, not a wheel. The
# shell hook reports its absence rather than passing silently — the same discipline the markdown
# package applies to pandoc.
#
# ⚑⚑⚑ `ruff` IS PINNED TO THE VERSION THE BUILD GRAPH STAGES, AND THE BARE NAME WAS NOT ENOUGH.
# `MODULE.bazel` fetches ruff 0.16.6 as an `http_archive`; this list said `"ruff"`, so a `uv sync`
# resolved 0.16.7 and MOVED THIS VENV OFF THE GRAPH'S VERSION — measured, in this repository, the
# moment the four distributions were first synced together. The gate runs `<dist>/.venv/bin/ruff`
# while the sandbox runs the archive, so an unpinned name means a checker that disagrees with
# itself by substrate.
# ⚑ AND THE PIN BELONGS HERE RATHER THAN IN `dev` BECAUSE THIS IS WHERE THE DEPENDENCY IS
# DECLARED: for this distribution the checkers are RUNTIME deps — invoking them is its function —
# so a `dev`-group pin would not constrain what a consumer installing the wheel receives.
dependencies = ["ruff==0.16.6", "mypy"]

# ⚑⚑ A CONSOLE SCRIPT IS WHAT MAKES ADOPTION *NOT* A SYMLINK. A settings.json hook line naming
# `mikemol-hook-structural-query` resolves through the installed distribution, so the adopting
# repo never points at a path in someone else's checkout — which is the arrangement whose latent
# `__file__` defect this package exists to end. The name is spelled out rather than abbreviated
# because it appears in a config file a human reads, not on a command line anyone types twice.
[project.scripts]
mikemol-hook-structural-query = "mikemol.hooks.structural_query:main"
# ⚑⚑⚑ SHIPPED, WARRANTED 52:52, AND INVOKED BY NOTHING. `no_chaining` carried a rubric section,
# 52 tests and 52 warrants, and was the one PreToolUse hook this repo's own plan listed as adopted
# while `settings.json` wired only its sibling. Its module docstring says so in the first
# paragraph. ⚑ A component with full coverage and no entry point is *the packager is not a user of
# its own package* — this repository's named defect — with the tests passing.
mikemol-hook-no-chaining = "mikemol.hooks.no_chaining:main"
# ⚑ WIRED IN THE SAME COMMIT THAT SHIPS IT, because the comment above records what happens
# otherwise: a hook with full coverage and no entry point is *the packager is not a user of its own
# package*, with the tests passing.
mikemol-hook-no-verify = "mikemol.hooks.no_verify:main"

[project.urls]
Homepage = "https://github.com/mikemol/mtools"

[dependency-groups]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
# ⚑⚑ NO `src/mikemol/__init__.py` — PEP 420 implicit namespace, shared with the sibling
# distribution in this repo. That absence is what lets `mikemol-hooks` and `mikemol-mdstruct`
# install side by side without either owning the prefix; an `__init__.py` would make the first
# installed one the exclusive owner and shadow the second.
include = ["mikemol.*"]

[tool.setuptools.package-data]
"mikemol.hooks" = ["py.typed"]

[tool.uv]
environments = ["sys_platform == 'linux'"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
markers = [
    "needs_shellcheck: requires the shellcheck binary, a SYSTEM dependency and not a wheel",
]

# ⚑⚑ THE BAR IS THE ONE THESE HOOKS ENFORCE, APPLIED TO THEMSELVES. A linting tool held to a
# weaker standard than it imposes is the shape its own refusal message argues against — and this
# package's `pycheck` hook is the thing that would be checking it.
[tool.mypy]
strict = true
extra_checks = true
strict_equality = true
disallow_any_decorated = true
disallow_any_explicit = true
disallow_any_expr = true
python_version = "3.13"
warn_unused_ignores = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
files = ["src", "tests"]
# ⚑⚑⚑ WITHOUT THIS, THE TESTS TYPE AS `Any` AND THE SUITE STILL PASSES. An editable install
# lands as a `.pth` plus an import-hook FINDER, and mypy reads the filesystem rather than running
# `sys.path` hooks — so `from mikemol.hooks import payload` resolves at RUNTIME and not to the
# type checker. Every expression through the package then degrades to `Any`, and under
# `disallow_any_expr` that surfaces as dozens of errors; without that setting it would have been
# SILENT, and a green suite would have stood in for a checked one.
#
# ⚑⚑ MEASURED ON THE SIBLING DISTRIBUTION, WHICH HAS THE DEFECT TODAY. `mikemol-mdstruct` sets
# `mypy_path = "stubs"` alone: its 90 tests pass and `mypy tests/test_frontmatter.py` reports 14
# errors, 13 of them `Any` from one unresolved import. **A passing test suite is a fact about the
# tests, never about the standard applied to them** — and this was reported as "ruff+mypy clean"
# on the strength of a `src`-only run.
#
# ⚑⚑⚑ ⟡mtools-drop-mypypath, MEASURED — AND ITS TRIGGER WAS MIS-STATED. This pair was filed as
# retiring "when bazel runfiles resolve imports by layout". It does not, and bazel is not the
# variable. The variable is whether the install is EDITABLE, which is a property of the developer
# venv rather than of the build system. Measured against a fresh non-editable install of each
# distribution, with dev dependencies present and BOTH lines deleted:
#
#     hooks     Success: no issues found in 16 source files
#     ratchet   Success: no issues found in 8 source files
#     mdstruct  Success — but only with `mypy_path = "stubs"` retained
#
# ⚑⚑ SO TWO THIRDS OF THE PAIR IS RETIRABLE AND THE LAST THIRD IS NOT A WORKAROUND AT ALL.
# `explicit_package_bases` and the `src` entry exist because an editable install lands as a `.pth`
# plus an import-hook finder that mypy cannot see. A `stubs` entry exists because a stubs
# directory is not a package and there is no install to be found through — that one is permanent,
# and calling it temporary was a category error.
#
# ⚑⚑ THE PAIR STAYS, AND THAT IS A DECISION RATHER THAN AN OMISSION. Flipping the venvs to
# non-editable would retire it and BREAK THE DEV LOOP: measured, an installed copy does not see a
# source edit, so every change would need a reinstall before any checker saw it. Trading a
# documented two-line config for a reinstall on every edit is a worse repository, and the ticket's
# premise — that this is temporary scaffolding awaiting bazel — is now known to be false.
# ⟡mtools-drop-mypypath is CLOSED as won't-fix, with the measurement above as its warrant.
mypy_path = "src"
# ⚑⚑ AND `mypy_path` ALONE MAKES THE SOURCE REACHABLE UNDER TWO NAMES. With `src` a search root,
# `src/mikemol/hooks/payload.py` is both `mikemol.hooks.payload` (from the project root) and
# `hooks.payload` (from `src/mikemol`), which mypy refuses outright — correctly, since it cannot
# know which one a consumer means. `explicit_package_bases` says the module name is derived from
# the declared roots, so exactly one spelling survives.
#
# ⚑ THE PAIR IS ONE SETTING IN TWO KEYS. Adding either alone leaves a working-looking config:
# without the path, the tests type as `Any`; without this, the whole run aborts before checking
# anything. Only together do they mean "the package is at `src/mikemol` and is called
# `mikemol.hooks`".
explicit_package_bases = true

[tool.ruff]
line-length = 100
target-version = "py313"
# ⚑⚑⚑ THE NAMESPACE IS DECLARED, NOT SUPPRESSED. `INP001` fires on a directory with no
# `__init__.py` because that is usually an oversight — and here it is the design twice over:
# `src/mikemol/` must stay empty of one so sibling distributions can share the prefix, and
# `tests/` is a collection root pytest imports by path rather than a package anything imports.
# The rule offers exactly this option for the deliberate case, so the answer is to TELL it.
#
# ⚑ AND THE DISTINCTION IS WORTH THE LINE: with this, a MISSING `__init__.py` anywhere else is
# still a finding. An `ignore = ["INP001"]` would buy the same silence at the cost of never
# hearing about a real oversight again.
#
# ⚑⚑ `tests` IS LISTED BECAUSE THE SIBLING DISTRIBUTION'S OMISSION WAS MEASURED, NOT ASSUMED.
# mdstruct declares only `src/mikemol`, and its `tests/` carries three live ruff findings that
# nothing had swept — the per-file hook only ever checked files as they were edited, and the
# suite's own green told a reader nothing about the lint bar reaching it. A passing test suite
# is a fact about the tests, never about the standard applied to them.
namespace-packages = ["src/mikemol", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D203", "D213", "COM812"]

# ⚑⚑ `@pytest.fixture()` CALLED, NOT BARE — AND THE TWO CHECKERS DISAGREE ABOUT THIS, so the
# disagreement has to be settled in config rather than re-argued per file. `pytest.fixture` is an
# OVERLOADED decorator: applied bare it resolves to the overload returning `FixtureFunction`,
# which under `disallow_any_decorated` degrades the decorated function's signature. Called, it
# resolves to the concrete-returning overload. ruff's PT001 defaults to preferring the bare form,
# which is the spelling mypy cannot type here — so the default is inverted rather than the rule
# suppressed, and a fixture written the other way is still a finding.
[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = true

# ⚑⚑ THE PATTERN IS STRICTER THAN ITS PROSE, AND DELIBERATELY. "Carry the two-line header"
# underspecifies it: this also fixes ORDER (SPDX first), ADJACENCY, the `#` prefix on the
# copyright line, and a 4-digit year. A file with both lines in the wrong order fails while
# looking correct to a reader — so the intake documentation must state the shape, not the gist.
#
# ⚑⚑ VERIFY THIS LINE WITH `ruff check --show-settings | grep notice_rgx`, NEVER BY READING IT.
# Reading the line you just wrote shows INTENT; --show-settings shows EFFECT. The string must be
# a TOML *literal* (single quotes): in a basic string `\.` is an invalid escape and `\\.` means
# backslash-dot, so a double-quoted version resolves to a regex that CANNOT MATCH — a gate that
# reads as adopted, passes every file, and is inert. Measured: written double-quoted here first,
# caught by --show-settings before it was armed.
#
# ⚑ `[ \t]*` AND NOT `\s*`, because `\s` matches newlines. With `\s*` the gate silently ACCEPTED
# a blank line between the two notices while REJECTING a `#` line between them — an inconsistency
# no reader predicts from the regex or its description. Found by cassian-observability, which
# tested its own migrating files against this pattern rather than accepting an assurance that
# they passed; the probe surfaced a defect in THIS config, not in cassian's files.
#
# ⚑ A THIRD CASE, and no F-arm reaches it: A REPORTED CONVENTION WITH NO POPULATION. substrate
# supplied this exact header form as its practice, cited from one file. Censused:
# `pycodemod --literal 'SPDX-License-Identifier' substrate/` → 0 sites in 0 of 556 files. The
# convention was inferred from a single witness and never censused; nothing fires because nothing
# exists, and the report is the only artifact. The discriminating act is not an arm but a CENSUS,
# and it costs one command. Consequence for intake: substrate-derived code arrives WITHOUT headers,
# so under this gate the header is a precondition of admission rather than a follow-up.
#
# ⚑⚑ THE GATE IS MEASURED ON THE VERSION THE LOCK INSTALLS, NOT ONLY THE ONE IN THE VENV. The
# `requirements.txt` beside this file pinned ruff 0.16.6 while the working venv ran 0.16.5 — so
# every arm below had been measured on a version bazel would NOT install. Resolved by installing
# the pinned version and re-running the whole matrix: identical results on both, corpus clean on
# both, all 140 warrant checks passing on both. The drift was benign; that it was UNMEASURED was
# not, and a rule set is a property of the resolver rather than of the config text.
#
# ⚑⚑⚑ F-ARMED PER PROPOSITION, NOT PER RULE. A configured-but-inert gate is the EASY case: it
# fires on nothing and someone eventually notices. AN ACTIVE GATE AIMED AT THE WRONG PREDICATE is
# the hard case — it produces findings, passes review, and its greens are indistinguishable from
# correct ones. This repo and linux-sources were MIRROR IMAGES of that: this notice-rgx matched
# SPDX only, its unset default matched `Copyright` only, so neither repo gated both lines and each
# party ran the arm its own config would pass. The arms below must all be re-run on any edit:
#
#   P1 intact          passes      F1 no SPDX          FIRES     F4 blank line between  FIRES
#   P2 shebang first   passes      F2 no copyright     FIRES     F5 `#` line between    FIRES
#   P3 year 2031       passes      F3 reversed order   FIRES     F6 wrong holder        FIRES
#
# P2 keeps codemod_header.py working (a `#!` not on line 1 stops being a shebang, so the notice
# follows it). P3 keeps the year `\d{4}` rather than literal 2026: a copyright year is the year of
# AUTHORSHIP, so a later file carries a later year without a config change. And the P arms are not
# decoration — without them, "every F arm fires" is indistinguishable from a gate refusing
# everything.
[tool.ruff.lint.flake8-copyright]
notice-rgx = '(?i)SPDX-License-Identifier: Apache-2\.0[ \t]*\n#[ \t]*Copyright \(c\) \d{4} Mike Mol'

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

# ⚑ RUNNING A CHECKER IS ONE MODULE'S ONE RESPONSIBILITY, and the exemption is scoped to that
# file rather than to the package. An entry naming a directory would grant it to every hook in
# order to cover one call — the blast radius a per-responsibility override exists to avoid.
"src/mikemol/hooks/verdict.py" = ["S603"]

# ⚑⚑ THE SAME RULE, THE SAME REASON, A SECOND NAMED FILE. `test_adoption.py`'s subject is what a
# real checkout produces WHEN INSTALLED, so building venvs and installing wheels is the case
# rather than a helper around it. ⚑ MEASURED: every argument is a literal or a path this module
# constructs — `sys.executable`, a `tempfile` directory, and `_SOURCE_TREE / dist` — so there is
# no untrusted input for S603 to be about here.
# ⚑ DECLARED IN CONFIG, NOT AS `noqa`. Three line directives were written first and the ratchet
# refused them as new keys, correctly: this repository's rule is DECLARE, NEVER SUPPRESS, and a
# line directive travels with the code into a peer tree that may not even enable the rule —
# measured by substrate as `RUF100 Unused noqa`. A config entry stays behind.
# ⚑⚑ `S404` IS PREVIEW-ONLY AND THE RATCHET SEES IT WHILE `ruff check` DOES NOT. The census runs
# ruff with `--preview`, so hoisting `import subprocess` to module scope minted a new baseline key
# that a plain preflight reports as clean — measured: `ruff check` passes, `ruff check --preview`
# names `suspicious-subprocess-import`. A gate and a preflight disagreeing about the same file is
# exactly the shape that makes a green local run mean nothing.
"tests/test_adoption.py" = ["S101", "S404", "S603"]

# ⚑⚑ THE THIRD NAMED FILE, AND THE SAME REASON AS THE SECOND. `test_no_verify.py`'s subject is
# what the INSTALLED console script decides — a hook can have a correct predicate and a broken
# entry point, and only running the installed binary can tell those apart. So invoking it is the
# case, not a helper around the case.
# ⚑ MEASURED: every argument is a literal or a path this module constructs — `_BIN` is built from
# `__file__`'s unresolved parent, and the payload is a `json.dumps` of literals — so there is no
# untrusted input for `S603` to be about here either.
# ⚑ DECLARED IN CONFIG, NOT AS `noqa`, following the entry above: a line directive travels with
# the code into a peer tree that may not enable the rule, and the ratchet refuses new keys.
"tests/test_no_verify.py" = ["S101", "S404", "S603"]

# ⚑⚑⚑ THE FOURTH NAMED FILE, AND RUNNING A SUBPROCESS IS THE WHOLE MEASUREMENT. `grade.py` awards
# `behavioral` only when a mutation makes a check go red, and a check cannot go red without being
# RUN. ⚑ It must be a fresh process rather than an import: Python caches a module's source at
# import time, so a grader that imported the test module would corrupt a file the already-imported
# test never re-reads — every arm would grade `indeterminate` and a whole suite would be reported
# unfalsifiable by an artifact of the grader.
# ⚑⚑ MEASURED, THE SAME PREVIEW SPLIT AS THE ENTRIES ABOVE: `ruff check` passes on this file and
# `ruff check --preview` names `suspicious-subprocess-import`, so the ratchet's preview census
# minted a key a plain preflight reports as clean. Declared here rather than as a `noqa`, because
# a line directive travels into a peer tree that may not enable the rule.
# ⚑ AND THE ARGUMENTS CARRY NO UNTRUSTED INPUT: the interpreter is `dist/.venv/bin/python3` built
# from a caller-supplied Path, the rest are literals and a test NAME — passed as an argv element
# to `-k`, never through a shell, which `test_the_grader_does_not_shell_out_through_a_shell` pins.
"src/mikemol/hooks/grade.py" = ["S404", "S603"]

# ⚑ THE GRADER'S OWN CASES. `S101` as everywhere in tests; `SLF001` for ONE arm that reaches
# `grade._flips` deliberately — that private function is the single place the reachable/passed
# TRISTATE is consumed, and an integration-level assertion cannot tell a real flip from a
# crash-flip. Testing the boundary requires crossing it, and the arm says so at its call site.
"tests/test_grade.py" = ["S101", "SLF001"]
