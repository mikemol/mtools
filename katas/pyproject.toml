[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# ⚑ THE HOST KATAS AS A TRACKED DISTRIBUTION (mtools:W796, W872). `~/github/.claude/katas/katas.py`
# lives under `.claude/`, where standing rule 16 refuses executable code, so it cannot be edited in
# place; the orchestration it keeps that no mtools tool already does is built here, calling those
# tools for the rest. A library for now: no console script, standard library only (the process seam
# `mikemol-procrun` joins with the detached commit, the next slice).
name = "mikemol-katas"
version = "0.1.0"
description = "The host orchestration katas: workstream discovery and the detached commit's bookkeeping, calling the mtools tools for the rest."
readme = "README.md"
requires-python = ">=3.13"
authors = [{name = "Mike Mol"}]
license = "Apache-2.0"
keywords = ["katas", "workstreams", "commit", "orchestration"]
classifiers = [
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

# ⚑ ONE SIBLING (mtools:W874): the process seam, `mikemol-procrun`, resolved by uv as a NON-editable
# path source below (an editable install hides the sibling from mypy); in Bazel it is a py_library
# dep, so the pip hubs stay independent of it and requirements.txt is deliberately NOT regenerated.
dependencies = ["mikemol-procrun"]

[project.urls]
Homepage = "https://github.com/mikemol/mtools"

[dependency-groups]
dev = ["pytest", "mypy", "ruff==0.16.6"]

[tool.uv.sources]
mikemol-procrun = { path = "../procrun" }

[tool.setuptools.packages.find]
where = ["src"]
# ⚑⚑ NO `src/mikemol/__init__.py`: PEP 420 implicit namespace, shared with the siblings.
include = ["mikemol.*"]

[tool.setuptools.package-data]
"mikemol.katas" = ["py.typed"]

[tool.uv]
environments = ["sys_platform == 'linux'"]

[tool.pytest.ini_options]
empty_parameter_set_mark = "fail_at_collect"  # a parametrize that collects zero cases FAILS; it never reads as a skip (W88, arms in W90)
testpaths = ["tests"]
norecursedirs = ["bazel-*", ".venv", ".git", ".claude", "*.egg-info", "__pycache__"]  # backstop: with tests/ absent the runner falls back to rootdir and walks these (measured by linux-sources, W297)
addopts = "--strict-markers --strict-config"
markers = []

# ⚑⚑ THE SIBLINGS' FULL STRICT BLOCK, unchanged. See ratchet/pyproject.toml for why each key.
[tool.mypy]
strict = true
extra_checks = true
strict_equality = true
disallow_any_decorated = true
disallow_any_explicit = true
disallow_any_expr = true
python_version = "3.13"
warn_unused_ignores = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
files = ["src", "tests"]
mypy_path = "src"
explicit_package_bases = true

[tool.ruff]
line-length = 100
target-version = "py313"
namespace-packages = ["src/mikemol", "tests"]

[tool.ruff.lint]
preview = true
select = ["ALL"]
ignore = ["incorrect-blank-line-before-class", "multi-line-summary-second-line", "missing-trailing-comma"]

# ⚑ THE SIBLING IS THIRD-PARTY TO THIS DISTRIBUTION, in the editor and in the sandbox alike (the
# treeio and ratchet precedent, W857): left to detection, a venv that has it installed classifies it
# with this package's own imports while the sandbox (no venv) puts it in its own block.
[tool.ruff.lint.isort]
known-third-party = ["mikemol.procrun"]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = true

# ⚑⚑ COPIED FROM ratchet/pyproject.toml, which carries the P/F arms this pattern was measured by.
# A TOML literal string: in a basic string `\.` is an invalid escape.
[tool.ruff.lint.flake8-copyright]
notice-rgx = '(?i)SPDX-License-Identifier: Apache-2\.0[ \t]*\n#[ \t]*Copyright \(c\) \d{4} Mike Mol'

# ⚑⚑ PER FILE, NEVER A GLOB. A `tests/*` entry would grant the next test module an exemption
# nobody chose for it; each line below is one module that needs it.
[tool.ruff.lint.per-file-ignores]
"tests/test_workstreams.py" = ["assert"]
"tests/test_commits.py" = ["assert"]
"tests/test_waiter.py" = ["assert", "suspicious-subprocess-import"]
# ⚑ `waiter` names `subprocess.TimeoutExpired`, the exception `capture` documents for a child that
# outlasts its timeout; it starts no child except through `capture`.
"src/mikemol/katas/waiter.py" = ["suspicious-subprocess-import"]
# ⚑ STARTING A DETACHED CHILD IS `detach`'S ONE RESPONSIBILITY (a Popen that outlives the caller,
# which `mikemol.procrun.capture` cannot be: it waits), and the exemption is scoped to that file.
# The argv is built here from the interpreter and literals plus the caller's argv, never a shell.
"src/mikemol/katas/detach.py" = [
    "subprocess-without-shell-equals-true",
    "suspicious-subprocess-import",
]
# ⚑ `test_detach` starts a real detached child through `detach.start` and waits, bounded, for the
# log's rc line, so it reads the same module-level exemptions as its subject.
"tests/test_detach.py" = ["assert"]
