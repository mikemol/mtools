[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# ⚑ THE MUTANT-CELL TOOLS of paperkit's tools/, migrated into mtools (mtools:W545, paperkit:W142,
# umbrella mtools:W531). `eval` runs one cell of the def-sweep (one check against one counterfactual
# engine); `cellargs`, `cellcgroup` and `cellstage` are its three siblings; `sens`, `decisions` and
# `def_sites` read or enumerate the grid; `sites` enumerates every perturbation site of an engine
# and reads the sibling distributions mikemol-mutation and mikemol-importdag.
name = "mikemol-mutantcell"
version = "0.1.0"
description = "The def-sweep's cell: run one check against one counterfactual, aggregate the cells' records."
readme = "README.md"
requires-python = ">=3.13"
authors = [{name = "Mike Mol"}]
license = "Apache-2.0"
keywords = ["mutation", "sweep", "cgroup", "sensitivity"]
classifiers = [
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

# ⚑ THE SIBLING EDGES (mtools:W562, ruled A+B): `sites` reads mikemol-mutation for the site
# enumerators and mikemol-importdag for the flat-import reader (which brings mikemol-atomicwrite
# transitively through its own source entry). BUILD.bazel carries the same edges.
dependencies = ["mikemol-mutation", "mikemol-importdag"]

[project.scripts]
mikemol-eval = "mikemol.mutantcell.eval:main"
mikemol-sites = "mikemol.mutantcell.sites:main"

[project.urls]
Homepage = "https://github.com/mikemol/mtools"

# ⚑ NOT EDITABLE: an editable install puts a finder hook on the path that mypy cannot resolve (W566).
[tool.uv.sources]
mikemol-mutation = { path = "../mutation" }
mikemol-importdag = { path = "../importdag" }

[dependency-groups]
# ⚑ THE SAME THREE AS THE SIBLINGS (see ratchet/pyproject.toml).
dev = ["pytest", "mypy", "ruff==0.16.6"]

[tool.setuptools.packages.find]
where = ["src"]
# ⚑⚑ NO `src/mikemol/__init__.py`: PEP 420 implicit namespace, shared with the siblings.
include = ["mikemol.*"]

[tool.setuptools.package-data]
"mikemol.mutantcell" = ["py.typed"]

[tool.uv]
environments = ["sys_platform == 'linux'"]

[tool.pytest.ini_options]
empty_parameter_set_mark = "fail_at_collect"  # a parametrize that collects zero cases FAILS; it never reads as a skip (W88, arms in W90)
testpaths = ["tests"]
norecursedirs = ["bazel-*", ".venv", ".git", ".claude", "*.egg-info", "__pycache__"]  # backstop: with tests/ absent the runner falls back to rootdir and walks these (measured by linux-sources, W297)
addopts = "--strict-markers --strict-config"
markers = []

# ⚑⚑ THE SIBLINGS' FULL STRICT BLOCK, unchanged. See ratchet/pyproject.toml for why each key.
[tool.mypy]
strict = true
extra_checks = true
strict_equality = true
disallow_any_decorated = true
disallow_any_explicit = true
disallow_any_expr = true
python_version = "3.13"
warn_unused_ignores = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
files = ["src", "tests"]
mypy_path = "src"
explicit_package_bases = true

[tool.ruff]
line-length = 100
target-version = "py313"
namespace-packages = ["src/mikemol", "tests"]

[tool.ruff.lint]
preview = true
select = ["ALL"]
ignore = ["incorrect-blank-line-before-class", "multi-line-summary-second-line", "missing-trailing-comma"]

[tool.ruff.lint.isort]
known-third-party = ["mikemol.mutation", "mikemol.importdag"]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = true

# ⚑⚑ COPIED FROM ratchet/pyproject.toml, which carries the P/F arms this pattern was measured by.
# A TOML literal string: in a basic string `\.` is an invalid escape.
[tool.ruff.lint.flake8-copyright]
notice-rgx = '(?i)SPDX-License-Identifier: Apache-2\.0[ \t]*\n#[ \t]*Copyright \(c\) \d{4} Mike Mol'

# ⚑⚑ PER FILE, NEVER A GLOB. A `tests/*` entry would grant the next test module an exemption
# nobody chose for it; each line below is one module that needs it.
[tool.ruff.lint.per-file-ignores]
# ⚑ eval's one responsibility is to spawn the check it measures: its import and its call are that.
"src/mikemol/mutantcell/eval.py" = ["suspicious-subprocess-import", "subprocess-without-shell-equals-true"]
"tests/test_cellargs.py" = ["assert"]
"tests/test_cellcgroup.py" = ["assert"]
"tests/test_cellstage.py" = ["assert"]
"tests/test_decisions.py" = ["assert"]
"tests/test_def_sites.py" = ["assert"]
"tests/test_eval.py" = ["assert", "suspicious-subprocess-import", "subprocess-without-shell-equals-true"]
"tests/test_sens.py" = ["assert"]
"tests/test_sibling_edge.py" = ["assert"]
"tests/test_sites.py" = ["assert", "suspicious-subprocess-import", "subprocess-without-shell-equals-true"]
