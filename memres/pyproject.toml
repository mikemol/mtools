[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# ⚑ THE MEMORY-RESERVATION TOOLS of paperkit's `tools/`, ported (mtools:W554, paperkit:W142,
# umbrella mtools:W531). One data product: a per-project sqlite store of observed cell peaks
# (`mem_learn`, `mem_db`, `mem_harvest`), its Starlark-readable projection (`mem_project`), and the
# build-host sizing helpers that sit beside it (`sweep_budget`, `cpuweight`, `zswap_probe`,
# `mem_converge`). None of them touches the memory-admission ledger, so none folds into
# `mikemol-fence` (W546). Standard library only.
name = "mikemol-memres"
version = "0.1.0"
description = "Memory reservation tools: an observation store of cell peaks, its projection, and build-host sizing helpers."
readme = "README.md"
requires-python = ">=3.13"
authors = [{name = "Mike Mol"}]
license = "Apache-2.0"
keywords = ["bazel", "memory", "cgroup", "reservation"]
classifiers = [
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

# ⚑ NO RUNTIME DEPENDENCY: sqlite3, json, pathlib and os are the standard library.
dependencies = []

[project.scripts]
mikemol-mem-project = "mikemol.memres.mem_project:main"
mikemol-mem-harvest = "mikemol.memres.mem_harvest:main"
mikemol-sweep-budget = "mikemol.memres.sweep_budget:main"
mikemol-cpuweight = "mikemol.memres.cpuweight:main"

[project.urls]
Homepage = "https://github.com/mikemol/mtools"

[dependency-groups]
# ⚑ THE SAME THREE AS THE SIBLINGS (see ratchet/pyproject.toml).
dev = ["pytest", "mypy", "ruff==0.16.6"]

[tool.setuptools.packages.find]
where = ["src"]
# ⚑⚑ NO `src/mikemol/__init__.py`: PEP 420 implicit namespace, shared with the siblings.
include = ["mikemol.*"]

[tool.setuptools.package-data]
"mikemol.memres" = ["py.typed"]

[tool.uv]
environments = ["sys_platform == 'linux'"]

[tool.pytest.ini_options]
empty_parameter_set_mark = "fail_at_collect"  # a parametrize that collects zero cases FAILS; it never reads as a skip (W88, arms in W90)
testpaths = ["tests"]
norecursedirs = ["bazel-*", ".venv", ".git", ".claude", "*.egg-info", "__pycache__"]  # backstop: with tests/ absent the runner falls back to rootdir and walks these (measured by linux-sources, W297)
addopts = "--strict-markers --strict-config"
markers = []

# ⚑⚑ THE SIBLINGS' FULL STRICT BLOCK, unchanged. See ratchet/pyproject.toml for why each key.
[tool.mypy]
strict = true
extra_checks = true
strict_equality = true
disallow_any_decorated = true
disallow_any_explicit = true
disallow_any_expr = true
python_version = "3.13"
warn_unused_ignores = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
files = ["src", "tests"]
mypy_path = "src"
explicit_package_bases = true

[tool.ruff]
line-length = 100
target-version = "py313"
namespace-packages = ["src/mikemol", "tests"]

[tool.ruff.lint]
preview = true
select = ["ALL"]
ignore = ["incorrect-blank-line-before-class", "multi-line-summary-second-line", "missing-trailing-comma"]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = true

# ⚑⚑ COPIED FROM ratchet/pyproject.toml, which carries the P/F arms this pattern was measured by.
# A TOML literal string: in a basic string `\.` is an invalid escape.
[tool.ruff.lint.flake8-copyright]
notice-rgx = '(?i)SPDX-License-Identifier: Apache-2\.0[ \t]*\n#[ \t]*Copyright \(c\) \d{4} Mike Mol'

# ⚑⚑ PER FILE, NEVER A GLOB. A `tests/*` entry would grant the next test module an exemption
# nobody chose for it; each line below is one module that needs it.
[tool.ruff.lint.per-file-ignores]
"tests/test_mem_learn.py" = ["assert"]
"tests/test_mem_db.py" = ["assert"]
"tests/test_mem_project.py" = ["assert"]
"tests/test_mem_harvest.py" = ["assert"]
"tests/test_mem_converge.py" = ["assert"]
"tests/test_sweep_budget.py" = ["assert"]
"tests/test_cpuweight.py" = ["assert"]
"tests/test_zswap_probe.py" = ["assert"]
