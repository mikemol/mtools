[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mikemol-cvdcore"
version = "0.1.0"
description = "The worst-view colour-vision-deficiency distance core: the minimum CAM02-UCS distance between two colours over four views, and the Okabe-Ito reference floor."
readme = "README.md"
requires-python = ">=3.13"
authors = [{name = "Mike Mol"}]
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["cvdcore"]
classifiers = [
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

# ⚑ TWO THIRD-PARTY DEPENDENCIES, numpy and colorspacious (el-openglo:W544): the CAM02-UCS conversion
# is colorspacious's, the vector arithmetic numpy's. Both are untyped at runtime for mypy, so
# `stubs` mirrors only the names the module uses, as treeio's stubs do for pygit2.
dependencies = ["numpy", "colorspacious"]

[project.urls]
Homepage = "https://github.com/mikemol/mtools"

[dependency-groups]
dev = ["pytest", "mypy", "ruff==0.16.6"]

[tool.setuptools.packages.find]
where = ["src"]
# ⚑⚑ NO `src/mikemol/__init__.py`: PEP 420 implicit namespace, shared with the siblings.
include = ["mikemol.*"]

[tool.setuptools.package-data]
"mikemol.cvdcore" = ["py.typed"]

[tool.uv]
environments = ["sys_platform == 'linux'"]

[tool.pytest.ini_options]
empty_parameter_set_mark = "fail_at_collect"  # a parametrize that collects zero cases FAILS; it never reads as a skip (W88, arms in W90)
testpaths = ["tests"]
norecursedirs = ["bazel-*", ".venv", ".git", ".claude", "*.egg-info", "__pycache__"]  # backstop: with tests/ absent the runner falls back to rootdir and walks these (measured by linux-sources, W297)
addopts = "--strict-markers --strict-config"
markers = []

# ⚑⚑ THE SIBLINGS' FULL STRICT BLOCK, unchanged. See ratchet/pyproject.toml for why each key.
[tool.mypy]
strict = true
extra_checks = true
strict_equality = true
disallow_any_decorated = true
disallow_any_explicit = true
disallow_any_expr = true
python_version = "3.13"
warn_unused_ignores = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
files = ["src", "tests"]
# ⚑ `stubs` IS THE THIRD-PARTY SURFACE (as in treeio and mdstruct): the bazel mypy runner cannot see
# runtime dependencies, so numpy and colorspacious would be import-not-found and Any under
# disallow_any_expr. The stubs mirror only the names cvdcore uses.
mypy_path = "src:stubs"
explicit_package_bases = true

[tool.ruff]
line-length = 100
target-version = "py313"
namespace-packages = ["src/mikemol", "tests"]

[tool.ruff.lint]
preview = true
select = ["ALL"]
ignore = ["incorrect-blank-line-before-class", "multi-line-summary-second-line", "missing-trailing-comma"]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = true

# ⚑⚑ COPIED FROM ratchet/pyproject.toml, which carries the P/F arms this pattern was measured by.
# A TOML literal string: in a basic string `\.` is an invalid escape.
[tool.ruff.lint.flake8-copyright]
notice-rgx = '(?i)SPDX-License-Identifier: Apache-2\.0[ \t]*\n#[ \t]*Copyright \(c\) \d{4} Mike Mol'

# ⚑⚑ PER FILE, NEVER A GLOB. A `tests/*` entry would grant the next test module an exemption
# nobody chose for it; each line below is one module that needs it.
[tool.ruff.lint.per-file-ignores]
"tests/test_dependencies.py" = ["assert"]
"tests/test_core.py" = ["assert"]
# ⚑ `worst_view_dE` IS THE NAME el-openglo's callers and nemik import (the capital E is the
# delta-E of colour science), so the public name cannot be snake_case without breaking them.
"src/mikemol/cvdcore/core.py" = ["invalid-function-name"]
# ⚑ THE STUB MIRRORS numpy's OWN NAME: the class is `ndarray` upstream, so CapWords cannot apply.
"stubs/numpy/__init__.pyi" = ["invalid-class-name"]
"tests/test_smoke.py" = ["assert"]
"tests/test_ucs.py" = ["assert"]
