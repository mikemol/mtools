[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
# ⚑⚑⚑ SIX REPOS CARRIED SIX COPIES OF THIS TOOL, AND THE COPIES DRIFTED INTO FOUR HASH SCHEMES.
# The survey (`.claude/swarm/paths-forward-merge-six.md`) measured every cell of a 2x2 grid of
# byte-forms occupied, two lock races, and two hardcoded roots. An installed package with one
# owner, pinned per adopter, is the operator's ruling (D2) on where the one copy lives.
name = "mikemol-pathsforward"
version = "0.1.0"
description = "The paths-forward loop's state file: one tagged hash, a refused over-budget payload, a flocked atomic store, and a check that reports."
readme = "README.md"
requires-python = ">=3.13"
authors = [{name = "Mike Mol"}]
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["paths-forward", "loop", "scheduler", "state", "waypoints"]
classifiers = [
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]

# ⚑ NO RUNTIME DEPENDENCIES. The tool reads and writes one JSON file with the standard library;
# anything it imported would become a dependency of every repo that runs a loop.
dependencies = []


[project.scripts]
mikemol-paths-forward = "mikemol.pathsforward.cli:main"

[project.urls]
Homepage = "https://github.com/mikemol/mtools"

[dependency-groups]
# ⚑ THE SAME THREE AS THE SIBLINGS, for the same reasons (see ratchet/pyproject.toml): mypy and
# pytest are staged by the bazel mypy action, and `.githooks/pre-commit` refuses without ruff.
# ⚑ AND `mikemol-procrun` (W2217) IN THE DEV GROUP ONLY: the witnesses that start the pinned opa
# as a child reach it through the one stdlib-only seam instead of each spelling the subprocess
# rules in a per-file exemption. The runtime list stays empty.
dev = ["pytest", "mypy", "ruff==0.16.6", "mikemol-procrun"]

[tool.setuptools.packages.find]
where = ["src"]
# ⚑⚑ NO `src/mikemol/__init__.py` — PEP 420 implicit namespace, shared with the siblings.
include = ["mikemol.*"]

[tool.setuptools.package-data]
"mikemol.pathsforward" = ["py.typed", "policy/*.rego"]

[tool.uv]
environments = ["sys_platform == 'linux'"]

[tool.uv.sources]
mikemol-procrun = { path = "../procrun" }

[tool.ruff.lint.isort]
known-third-party = ["mikemol.procrun"]

[tool.pytest.ini_options]
empty_parameter_set_mark = "fail_at_collect"  # a parametrize that collects zero cases FAILS; it never reads as a skip (W88, arms in W90)
testpaths = ["tests"]
norecursedirs = ["bazel-*", ".venv", ".git", ".claude", "*.egg-info", "__pycache__"]  # backstop: with tests/ absent the runner falls back to rootdir and walks these (measured by linux-sources, W297)
addopts = "--strict-markers --strict-config"
# ⚑ NO MARKERS. The lock tests use real processes and are bounded by their own timeouts rather
# than skipped, so there is nothing to mark.
markers = []

# ⚑⚑ THE SIBLINGS' FULL STRICT BLOCK, unchanged. See ratchet/pyproject.toml for why each key.
[tool.mypy]
strict = true
extra_checks = true
strict_equality = true
disallow_any_decorated = true
disallow_any_explicit = true
disallow_any_expr = true
python_version = "3.13"
warn_unused_ignores = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
files = ["src", "tests"]
mypy_path = "src"
explicit_package_bases = true

[tool.ruff]
line-length = 100
target-version = "py313"
namespace-packages = ["src/mikemol", "tests"]

[tool.ruff.lint]
preview = true
select = ["ALL"]
ignore = ["incorrect-blank-line-before-class", "multi-line-summary-second-line", "missing-trailing-comma"]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = true

# ⚑⚑ COPIED FROM ratchet/pyproject.toml, which carries the P/F arms this pattern was measured by.
# A TOML literal string: in a basic string `\.` is an invalid escape.
[tool.ruff.lint.flake8-copyright]
notice-rgx = '(?i)SPDX-License-Identifier: Apache-2\.0[ \t]*\n#[ \t]*Copyright \(c\) \d{4} Mike Mol'

# ⚑⚑ PER FILE, NEVER A GLOB. A `tests/*` entry would grant the next test module an exemption
# nobody chose for it; each line below is one module that needs it.
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["assert"]
# ⚑ RUNNING opa IS ONE RESPONSIBILITY, SO IT IS ONE MODULE (W850), as mdstruct's pandoc.py is. The
# argv is the resolved opa binary, fixed words and the package's own policy path; the queue
# travels on stdin as data and never becomes a word in the command.
"src/mikemol/pathsforward/opa_eval.py" = [
    "subprocess-without-shell-equals-true",
    "suspicious-subprocess-import",
]
# ⚑ RUNNING THE TRANSCRIPT READER IS ONE RESPONSIBILITY, SO IT IS ONE MODULE (W1384): the argv is the
# reader's name, fixed words and the citation's own path, uuid and claim; nothing is run through a shell.
"src/mikemol/pathsforward/warrant.py" = [
    "subprocess-without-shell-equals-true",
    "suspicious-subprocess-import",
]
# ⚑ STARTING THE OTLP CHILD IS ONE RESPONSIBILITY, SO IT IS ONE MODULE (W1248): the argv is the
# resolved mikemol-otlp binary and fixed words; the refusal text travels on stdin as data.
"src/mikemol/pathsforward/refusal_record.py" = [
    "subprocess-without-shell-equals-true",
    "suspicious-subprocess-import",
]
# ⚑ RUNNING THE REPO'S OWN TICK COMMANDS IS ONE RESPONSIBILITY, SO IT IS ONE MODULE (W1348): the
# argv is a line the repo stored in its own queue, split with shlex and run without a shell.
"src/mikemol/pathsforward/tickhooks.py" = [
    "subprocess-without-shell-equals-true",
    "suspicious-subprocess-import",
]
# ⚑ READING THE COMMIT LOG IS ONE RESPONSIBILITY, SO IT IS ONE MODULE (W1377): the argv is the git
# binary and fixed words plus a stamp from the ledger; nothing is run through a shell.
"src/mikemol/pathsforward/landed.py" = [
    "subprocess-without-shell-equals-true",
    "suspicious-subprocess-import",
]
# ⚑ THE STORE AND CLI WITNESSES RUN REAL PROCESSES, because the defects they close were races
# between processes: argv lists built from `sys.executable`, never a shell, never untrusted input.
"tests/test_store.py" = [
    "assert",
    "subprocess-without-shell-equals-true",
    "suspicious-subprocess-import",
]
"tests/test_lock.py" = [
    "assert",
    "subprocess-without-shell-equals-true",
    "suspicious-subprocess-import",
]

# CODON REJECTS A BARE `*,` AND A TYPE_CHECKING GUARD (mtools:W1319, W1340, W1343): the rules
# that demand them are off for this dist.
"src/mikemol/pathsforward/digest.py" = ["boolean-type-hint-positional-argument"]

# CODON REJECTS A BARE `*,` AND A TYPE_CHECKING GUARD (mtools:W1319, W1340, W1343): the rules
# that demand them are off for this dist.
"src/mikemol/pathsforward/payload.py" = ["boolean-default-value-positional-argument", "boolean-type-hint-positional-argument"]
