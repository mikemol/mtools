# ⚑ RUNNING opa IS ONE RESPONSIBILITY, SO IT IS ONE MODULE (W850), as mdstruct's pandoc.py is. The
# argv is the resolved opa binary, fixed words and the package's own policy path; the queue
# travels on stdin as data and never becomes a word in the command.
"src/mikemol/pathsforward/opa_eval.py" = [
    "subprocess-without-shell-equals-true",
    "suspicious-subprocess-import",
]
# ⚑ RUNNING THE TRANSCRIPT READER IS ONE RESPONSIBILITY, SO IT IS ONE MODULE (W1384): the argv is the
# reader's name, fixed words and the citation's own path, uuid and claim; nothing is run through a shell.
"src/mikemol/pathsforward/warrant.py" = [
    "subprocess-without-shell-equals-true",
    "suspicious-subprocess-import",
]
# ⚑ STARTING THE OTLP CHILD IS ONE RESPONSIBILITY, SO IT IS ONE MODULE (W1248): the argv is the
# resolved mikemol-otlp binary and fixed words; the refusal text travels on stdin as data.
"src/mikemol/pathsforward/refusal_record.py" = [
    "subprocess-without-shell-equals-true",
    "suspicious-subprocess-import",
]
# ⚑ RUNNING THE REPO'S OWN TICK COMMANDS IS ONE RESPONSIBILITY, SO IT IS ONE MODULE (W1348): the
# argv is a line the repo stored in its own queue, split with shlex and run without a shell.
"src/mikemol/pathsforward/tickhooks.py" = [
    "subprocess-without-shell-equals-true",
    "suspicious-subprocess-import",
]
# ⚑ READING THE COMMIT LOG IS ONE RESPONSIBILITY, SO IT IS ONE MODULE (W1377): the argv is the git
# binary and fixed words plus a stamp from the ledger; nothing is run through a shell.
"src/mikemol/pathsforward/landed.py" = [
    "subprocess-without-shell-equals-true",
    "suspicious-subprocess-import",
]
