[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
# ⚑⚑⚑ SIX REPOS CARRIED SIX COPIES OF THIS TOOL, AND THE COPIES DRIFTED INTO FOUR HASH SCHEMES.
# The survey (`.claude/swarm/paths-forward-merge-six.md`) measured every cell of a 2x2 grid of
# byte-forms occupied, two lock races, and two hardcoded roots. An installed package with one
# owner, pinned per adopter, is the operator's ruling (D2) on where the one copy lives.
name = "mikemol-pathsforward"
version = "0.1.0"
description = "The paths-forward loop's state file: one tagged hash, a refused over-budget payload, a flocked atomic store, and a check that reports."
readme = "README.md"
requires-python = ">=3.13"
authors = [{name = "Mike Mol"}]
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["paths-forward", "loop", "scheduler", "state", "waypoints"]
classifiers = [
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]

# ⚑ NO RUNTIME DEPENDENCIES. The tool reads and writes one JSON file with the standard library;
# anything it imported would become a dependency of every repo that runs a loop.
dependencies = []


[project.scripts]
mikemol-paths-forward = "mikemol.pathsforward.cli:main"

[project.urls]
Homepage = "https://github.com/mikemol/mtools"

[dependency-groups]
# ⚑ THE SAME THREE AS THE SIBLINGS, for the same reasons (see ratchet/pyproject.toml): mypy and
# pytest are staged by the bazel mypy action, and `.githooks/pre-commit` refuses without ruff.
dev = ["pytest", "mypy", "ruff==0.16.6"]

[tool.setuptools.packages.find]
where = ["src"]
# ⚑⚑ NO `src/mikemol/__init__.py` — PEP 420 implicit namespace, shared with the siblings.
include = ["mikemol.*"]

[tool.setuptools.package-data]
"mikemol.pathsforward" = ["py.typed", "policy/*.rego"]

[tool.uv]
environments = ["sys_platform == 'linux'"]

[tool.pytest.ini_options]
empty_parameter_set_mark = "fail_at_collect"  # a parametrize that collects zero cases FAILS; it never reads as a skip (W88, arms in W90)
testpaths = ["tests"]
norecursedirs = ["bazel-*", ".venv", ".git", ".claude", "*.egg-info", "__pycache__"]  # backstop: with tests/ absent the runner falls back to rootdir and walks these (measured by linux-sources, W297)
addopts = "--strict-markers --strict-config"
# ⚑ NO MARKERS. The lock tests use real processes and are bounded by their own timeouts rather
# than skipped, so there is nothing to mark.
markers = []

# ⚑⚑ THE SIBLINGS' FULL STRICT BLOCK, unchanged. See ratchet/pyproject.toml for why each key.
[tool.mypy]
strict = true
extra_checks = true
strict_equality = true
disallow_any_decorated = true
disallow_any_explicit = true
disallow_any_expr = true
python_version = "3.13"
warn_unused_ignores = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
files = ["src", "tests"]
mypy_path = "src"
explicit_package_bases = true

[tool.ruff]
line-length = 100
target-version = "py313"
namespace-packages = ["src/mikemol", "tests"]

[tool.ruff.lint]
preview = true
select = ["ALL"]
ignore = ["incorrect-blank-line-before-class", "multi-line-summary-second-line", "missing-trailing-comma"]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = true

# ⚑⚑ COPIED FROM ratchet/pyproject.toml, which carries the P/F arms this pattern was measured by.
# A TOML literal string: in a basic string `\.` is an invalid escape.
[tool.ruff.lint.flake8-copyright]
notice-rgx = '(?i)SPDX-License-Identifier: Apache-2\.0[ \t]*\n#[ \t]*Copyright \(c\) \d{4} Mike Mol'

# ⚑⚑ PER FILE, NEVER A GLOB. A `tests/*` entry would grant the next test module an exemption
# nobody chose for it; each line below is one module that needs it.
[tool.ruff.lint.per-file-ignores]
"tests/test_model.py" = ["assert"]
"tests/test_advice.py" = ["assert"]
