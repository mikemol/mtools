# The house mypy config for this atom's scripts (W326), copied from the root pyproject's
# [tool.mypy]. ⚑ mypy.ini, NOT pyproject.toml: the gates find distributions by
# `*/pyproject.toml`, and an atom is not one.
[mypy]
strict = True
extra_checks = True
strict_equality = True
disallow_any_decorated = True
disallow_any_explicit = True
disallow_any_expr = True
python_version = 3.13
warn_unused_ignores = True
warn_unreachable = True
enable_error_code = ignore-without-code, redundant-expr, truthy-bool
files = mutate_runner.py, test_mutate_runner.py
explicit_package_bases = True
# The fence sibling edge (W619): the runner imports `mikemol.fence.git_env`, so mypy reads fence's
# source root. A sibling of the checkout's atom directory.
# Two spellings, one per layout: a checkout (the atom is a sibling of fence) and a bazel runfiles
# tree (the atom is an external repo beside `_main`, which stages `//fence:fence`).
# The mutation sibling edge (W629) is the same: the runner imports `mikemol.mutation.declarations`.
mypy_path = $MYPY_CONFIG_FILE_DIR/../fence/src:$MYPY_CONFIG_FILE_DIR/../_main/fence/src:$MYPY_CONFIG_FILE_DIR/../mutation/src:$MYPY_CONFIG_FILE_DIR/../_main/mutation/src
