[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# ⚑⚑ CLEANROOMED FROM substrate's scratch/pycodemod.py and its 12 `_pycodemod_*` siblings (the W43
# letter, inbox/2026-09-25-substrate-pycodemod-port-letter.md; operator ruling "port it
# (cleanroom)"). A structural query tool over Python source: the tool the structural-query hook
# and struct-tools route textual questions to. Rebuilt module by module against a DIFFERENTIAL
# with the origin, whose own suite baselines at 407/408.
name = "mikemol-pycodemod"
version = "0.1.0"
description = "Structural queries over Python source — where a name is called, read, bound or asserted — that report what they could not see instead of a false zero."
readme = "README.md"
requires-python = ">=3.13"
authors = [{name = "Mike Mol"}]
license = "Apache-2.0"
keywords = ["codemod", "libcst", "structural-query", "census"]
classifiers = [
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]

# ⚑⚑ libcst IS REQUIRED, NOT OPTIONAL. The origin imported it under try/except and every CST mode
# returned [] without it — a zero reading as an absence, the defect class this port exists to end.
# A missing libcst is now an install-time failure.
#
# ⚑ THE DIRECTORY-OPERAND WALK LIVES IN mikemol-pathwalk (mtools:W573), a stdlib-only sibling,
# so mdstruct can reuse it without libcst. The A+B sibling edge (mtools:W562): uv resolves it as a
# NON-editable path source; Bazel carries it as a py_library dependency in BUILD.bazel; the pip hubs
# do not resolve it and requirements.txt is deliberately NOT regenerated. Kept in step by hand.
dependencies = ["libcst", "mikemol-pathwalk"]

# ⚑⚑ SQLALCHEMY IS AN OPTIONAL EXTRA, NOT A DEPENDENCY (operator ruling, 2026-09-25). Only
# `funcnames` needs it, to ASK SQLAlchemy which `func.<name>` calls it translates per dialect; a
# roster here would go stale on an upgrade. Without the extra, `funcnames` REFUSES — it never
# grades every call `verbatim`, which would read as a finding and be the instrument being blind.
[project.optional-dependencies]
sqlalchemy = ["sqlalchemy"]

[project.urls]
Homepage = "https://github.com/mikemol/mtools"

[project.scripts]
mikemol-pycodemod = "mikemol.pycodemod.cli:_console"

[dependency-groups]
# ⚑ THE SAME THREE AS THE SIBLINGS, for the same reasons (see ratchet/pyproject.toml).
# ⚑ PLUS sqlalchemy, so `funcnames` is type-checked and tested against the real registry: the dev
# hub (pycodemod_dev) is built from uv.lock's dev group, not from the extra.
dev = ["pytest", "mypy", "ruff==0.16.6", "sqlalchemy"]

[tool.setuptools.packages.find]
where = ["src"]
# ⚑⚑ NO `src/mikemol/__init__.py` — PEP 420 implicit namespace, shared with the siblings.
include = ["mikemol.*"]

[tool.setuptools.package-data]
"mikemol.pycodemod" = ["py.typed"]

[tool.uv]
environments = ["sys_platform == 'linux'"]

[tool.uv.sources]
mikemol-pathwalk = { path = "../pathwalk" }

[tool.pytest.ini_options]
empty_parameter_set_mark = "fail_at_collect"  # a parametrize that collects zero cases FAILS; it never reads as a skip (W88, arms in W90)
testpaths = ["tests"]
norecursedirs = ["bazel-*", ".venv", ".git", ".claude", "*.egg-info", "__pycache__"]  # backstop: with tests/ absent the runner falls back to rootdir and walks these (measured by linux-sources, W297)
addopts = "--strict-markers --strict-config"
markers = []

# ⚑⚑ THE SIBLINGS' FULL STRICT BLOCK, unchanged. See ratchet/pyproject.toml for why each key.
[tool.mypy]
strict = true
extra_checks = true
strict_equality = true
disallow_any_decorated = true
disallow_any_explicit = true
disallow_any_expr = true
python_version = "3.13"
warn_unused_ignores = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
files = ["src", "tests", "differential"]
mypy_path = "src"
explicit_package_bases = true

[tool.ruff]
line-length = 100
target-version = "py313"
namespace-packages = ["src/mikemol", "tests", "differential"]

[tool.ruff.lint]
preview = true
select = ["ALL"]
ignore = ["incorrect-blank-line-before-class", "multi-line-summary-second-line", "missing-trailing-comma"]

# ⚑ THE SIBLING IS ANOTHER DISTRIBUTION, SO IT SORTS AS THIRD PARTY IN EVERY ENVIRONMENT. Left to
# detection, ruff classified `mikemol.pathwalk` first-party on a host checkout (where `src` holds
# the namespace) and third-party in the bazel sandbox (where only this dist's sources are staged):
# the same import block was sorted in one and unsorted in the other (measured, //pycodemod:ratchet).
[tool.ruff.lint.isort]
known-third-party = ["mikemol.pathwalk"]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = true

[tool.ruff.lint.flake8-copyright]
notice-rgx = '(?i)SPDX-License-Identifier: Apache-2\.0[ \t]*\n#[ \t]*Copyright \(c\) \d{4} Mike Mol'

# ⚑⚑ PER FILE, NEVER A GLOB: each line is one module that needs it.
[tool.ruff.lint.per-file-ignores]
"tests/test_atomize.py" = ["assert"]
"tests/test_pathdrop.py" = ["assert"]
"tests/test_typedargs.py" = ["assert"]
"tests/test_scriptruns.py" = ["assert"]
"tests/test_capture.py" = ["assert"]
"tests/test_census_fp.py" = ["assert"]
"tests/test_aliases.py" = ["assert"]
"tests/test_artifacts.py" = ["assert"]
"tests/test_header.py" = ["assert"]
"tests/test_ambient.py" = ["assert"]
"tests/test_arguments.py" = ["assert"]
"tests/test_cli.py" = ["assert", "private-member-access", "suspicious-subprocess-import", "subprocess-without-shell-equals-true"]
"tests/test_commentary.py" = ["assert"]
"tests/test_control_census.py" = ["assert"]
"tests/test_control_provenance.py" = ["assert"]
"tests/test_control_roster.py" = ["assert"]
"tests/test_core.py" = ["assert"]
"tests/test_crossings.py" = ["assert"]
"tests/test_dead.py" = ["assert"]
"tests/test_discards.py" = ["assert"]
"tests/test_definitions.py" = ["assert"]
"tests/test_deps.py" = ["assert"]
"tests/test_exit.py" = ["assert"]
"tests/test_fingerprint.py" = ["assert"]
"tests/test_fp_sites.py" = ["assert"]
"tests/test_funcnames.py" = ["assert"]
"tests/test_hints.py" = ["assert"]
# ⚑ ONE FILE, ONE RESPONSIBILITY: funcnames exists to ASK SQLAlchemy's private `_registry` which
# names Core translates (no public API answers it, and a roster here would go stale). The private
# read is the module's job, and an empty or moved registry refuses loudly (RegistryMovedError).
"src/mikemol/pycodemod/funcnames.py" = ["import-private-name"]
# ⚑ ONE FILE, ONE RESPONSIBILITY: owes exists to ASK GIT which files a change touched. The argv is
# fixed apart from the revision, which is refused when it starts with `-` and is followed by `--`,
# and git is resolved on PATH once.
"src/mikemol/pycodemod/owes.py" = ["suspicious-subprocess-import", "subprocess-without-shell-equals-true"]
"tests/test_owes.py" = ["assert", "suspicious-subprocess-import", "subprocess-without-shell-equals-true"]
# ⚑ THE OPERAND PRINTS RUN `git init` AND `git worktree add` IN A DECOY REPOSITORY under tmp_path: the
# argv is fixed and git is resolved on PATH once. The walk itself is mikemol-pathwalk's.
"tests/test_operands.py" = ["assert", "suspicious-subprocess-import", "subprocess-without-shell-equals-true"]
"tests/test_sibling_edge.py" = ["assert"]
"tests/test_graph.py" = ["assert"]
"tests/test_imports.py" = ["assert"]
"tests/test_layout.py" = ["assert"]
"tests/test_modstate.py" = ["assert"]
"tests/test_ordering.py" = ["assert"]
"tests/test_placement.py" = ["assert"]
"tests/test_portable.py" = ["assert"]
"tests/test_report.py" = ["assert"]
"tests/test_reads.py" = ["assert"]
"tests/test_referents.py" = ["assert"]
"tests/test_registered.py" = ["assert"]
"tests/test_relalg.py" = ["assert"]
"tests/test_relations.py" = ["assert"]
"tests/test_rivals.py" = ["assert"]
"tests/test_shapes.py" = ["assert"]
"tests/test_sites.py" = ["assert"]
"tests/test_size.py" = ["assert"]
"tests/test_snapshots.py" = ["assert"]
"tests/test_split.py" = ["assert"]
"tests/test_split_behaviour.py" = ["assert"]
"tests/test_split_differential.py" = ["assert"]
"tests/test_sql.py" = ["assert"]
"tests/test_storeflow.py" = ["assert"]
"tests/test_strings.py" = ["assert"]
"tests/test_swallows.py" = ["assert"]
"tests/test_writes.py" = ["assert"]
