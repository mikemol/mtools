#
# ⚑ PUBLISH EVERY DIST TO TESTPYPI OR PYPI, ONLY WHEN THE OPERATOR DISPATCHES IT (mtools:W1195,
# goal W1143). Nothing runs on a push or a tag: `workflow_dispatch` with an `index` choice is the
# one trigger, and the `pypi` environment is meant to require the operator's approval, so the final
# upload is the operator's act and not a side effect of a merge.
#
# ⚑ NO STORED TOKEN. Each index trusts this workflow by what it IS (trusted publishing, OIDC): the
# publish job holds `id-token: write` and nothing else, and names the environment (`testpypi` or
# `pypi`) the operator registered on each project. A key is never typed into a card or a secret.
#
# ⚑ THE UPLOAD IS ONLY WHAT THE CHECK PASSED. The `build` job runs `mikemol-wheel release-check`
# over every dist at this commit with the shipped-file privacy judge, the README renderer and the
# metadata check all required (exit 1 stops the run), and uploads exactly the artifacts it built.
# The `publish` job downloads those and uploads them unchanged.
#
# ⚑ EVERY THIRD-PARTY ACTION IS PINNED BY COMMIT, and the opa binary by sha256 (the one MODULE.bazel
# pins), so the run cannot change under a moved tag. Names, per-project steps: .claude/design/pypi-publish.md.

name: publish

on:
  workflow_dispatch:
    inputs:
      index:
        description: "testpypi first; pypi only after the TestPyPI install worked"
        type: choice
        options:
          - testpypi
          - pypi
        required: true

permissions: {}

env:
  OPA_URL: https://github.com/open-policy-agent/opa/releases/download/v1.20.2/opa_linux_amd64_static
  OPA_SHA256: 69da5179ee403d10fa11bab6cfb4ffb0d23dba5f9b682fa977db772a1da5670f

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install the pinned build tools
        run: python -m pip install --require-hashes --no-deps -r pkgbuild/requirements-dev.txt
      - name: Fetch opa by hash
        run: |
          curl -fsSL -o "$RUNNER_TEMP/opa" "$OPA_URL"
          echo "$OPA_SHA256  $RUNNER_TEMP/opa" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/opa"
      - name: Name the privacy judge
        run: |
          printf '#!/bin/sh\nexec python -m mikemol.hooks.privacy_shipped "$@"\n' > "$RUNNER_TEMP/privacy-shipped"
          chmod +x "$RUNNER_TEMP/privacy-shipped"
      - name: Build every dist at this commit and check each
        env:
          PYTHONPATH: pkgbuild/src:hooks/src
          OPA_BIN: ${{ runner.temp }}/opa
          MIKEMOL_PRIVACY_SHIPPED: ${{ runner.temp }}/privacy-shipped
          MIKEMOL_PRIVACY_POLICY: hooks/policy/publish_privacy.rego
        run: python -m mikemol.pkgbuild.wheel release-check . "$GITHUB_SHA" out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dists
          path: out/*/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ inputs.index }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dists
          path: built
      - name: Flatten the artifacts into one directory
        run: |
          mkdir flat
          cp built/*/* flat/
      - name: Upload to TestPyPI
        if: inputs.index == 'testpypi'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: flat
          skip-existing: true
      - name: Upload to PyPI
        if: inputs.index == 'pypi'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: flat
