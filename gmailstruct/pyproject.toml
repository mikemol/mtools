[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# ⚑⚑ EVERY MESSAGE IN EXACTLY ONE RECORD. life asked for a Gmail reader (life:W27, W287) whose
# output can be counted against its input: a message the narrowing cannot read is an `Unreadable`
# record with a reason, never a skip. Stage 1 is `records.message`: one users.messages.get JSON.
name = "mikemol-gmailstruct"
version = "0.1.0"
description = "Gmail API message JSON read losslessly: every message in exactly one record, the unreadable ones carried with a reason rather than dropped."
readme = "README.md"
requires-python = ">=3.13"
authors = [{name = "Mike Mol"}]
license = "Apache-2.0"
keywords = ["gmail", "email", "lossless"]
classifiers = [
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Email",
    "Typing :: Typed",
]

# ⚑ THE RECORD LAYER IS STDLIB ONLY. Auth (W288) and the HTTP client never reach it.
dependencies = []

[project.scripts]
mikemol-gmail = "mikemol.gmailstruct.cli:main"

[project.urls]
Homepage = "https://github.com/mikemol/mtools"

[dependency-groups]
# ⚑ THE SAME THREE AS THE SIBLINGS, for the same reasons (see ratchet/pyproject.toml): mypy and
# pytest are staged by the bazel mypy action, and `.githooks/pre-commit` refuses without ruff.
dev = ["pytest", "mypy", "ruff==0.16.6"]

[tool.setuptools.packages.find]
where = ["src"]
# ⚑⚑ NO `src/mikemol/__init__.py` — PEP 420 implicit namespace, shared with the siblings.
include = ["mikemol.*"]

[tool.setuptools.package-data]
"mikemol.gmailstruct" = ["py.typed"]

[tool.uv]
environments = ["sys_platform == 'linux'"]

[tool.pytest.ini_options]
empty_parameter_set_mark = "fail_at_collect"  # a parametrize that collects zero cases FAILS; it never reads as a skip (W88, arms in W90)
testpaths = ["tests"]
norecursedirs = ["bazel-*", ".venv", ".git", ".claude", "*.egg-info", "__pycache__"]  # backstop: with tests/ absent the runner falls back to rootdir and walks these (measured by linux-sources, W297)
addopts = "--strict-markers --strict-config"
# ⚑ NO MARKERS. Every fixture is synthetic (@example.invalid); no real mail enters this tree.
markers = []

# ⚑⚑ THE SIBLINGS' FULL STRICT BLOCK, unchanged. See ratchet/pyproject.toml for why each key.
[tool.mypy]
strict = true
extra_checks = true
strict_equality = true
disallow_any_decorated = true
disallow_any_explicit = true
disallow_any_expr = true
python_version = "3.13"
warn_unused_ignores = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
files = ["src", "tests"]
mypy_path = "src"
explicit_package_bases = true

[tool.ruff]
line-length = 100
target-version = "py313"
namespace-packages = ["src/mikemol", "tests"]

[tool.ruff.lint]
preview = true
select = ["ALL"]
ignore = ["incorrect-blank-line-before-class", "multi-line-summary-second-line", "missing-trailing-comma"]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = true

# ⚑⚑ COPIED FROM ratchet/pyproject.toml, which carries the P/F arms this pattern was measured by.
# A TOML literal string: in a basic string `\.` is an invalid escape.
[tool.ruff.lint.flake8-copyright]
notice-rgx = '(?i)SPDX-License-Identifier: Apache-2\.0[ \t]*\n#[ \t]*Copyright \(c\) \d{4} Mike Mol'

# ⚑ RUNNING `age` IS ONE OF THE CLI'S EFFECTS (W356): an argv list built from the operator's own
# flags, no shell, the token on stdin. The record and auth modules start no process.
# ⚑⚑ PER FILE, NEVER A GLOB. A `tests/*` entry would grant the next test module an exemption
# nobody chose for it; each line below is one module that needs it.
[tool.ruff.lint.per-file-ignores]
"src/mikemol/gmailstruct/cli.py" = [
    "subprocess-without-shell-equals-true",
    "suspicious-subprocess-import",
]
"tests/test_records.py" = ["assert"]
"tests/test_pages.py" = ["assert"]
"tests/test_parts.py" = ["assert"]
# ⚑ THE PLANTED TOKEN IS THE TEST'S SUBJECT: a synthetic value, planted so each arm can show it
# is absent from every traceback. It is a hard-coded "password" by construction, and authenticates
# nothing.
"tests/test_auth.py" = ["assert", "hardcoded-password-string"]
# ⚑ THE SAME FOR THE EXCHANGE: its planted refresh token, client secret and access token exist so
# each arm can show none of them reaches a traceback.
"tests/test_exchange.py" = ["assert", "hardcoded-password-string"]
# ⚑ AND THE CONSENT RUN: its planted client secret, code and refresh token exist so each arm can
# show the token reaches only `encrypt` and nothing reaches a traceback.
"tests/test_consent.py" = ["assert", "hardcoded-password-string"]
# ⚑ AND THE CLI'S EFFECTS: a planted client secret, code and refresh token, run through a fake age,
# a local listener and a local token endpoint.
"tests/test_cli.py" = ["assert", "hardcoded-password-string"]
