[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# ⚑ paperkit's `verdict`, `grades_rec`, `read_grade` and `effective`, moved together (mtools:W548, a
# cut of W532). `report_refresh` stays in paperkit (decision recorded on W548).
name = "mikemol-gradekit"
version = "0.1.0"
description = "Read grade records: the verdict record, the per-claim grade reading, the project table and the effective-grade clamp."
readme = "README.md"
requires-python = ">=3.13"
authors = [{name = "Mike Mol"}]
license = "Apache-2.0"
keywords = ["grade", "verdict", "paperkit"]
classifiers = [
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

# ⚑ THREE SIBLING DISTRIBUTIONS (operator ruling mtools:W562, mechanism A+B, measured in W566):
# `mikemol-grade` (the ladder and the clamp), `mikemol-bibparse` (the claim-edge reader) and
# `mikemol-atomicwrite` (the durable write). They are path sources below, NOT editable (an editable
# install hides the sibling from mypy), and in Bazel they are `py_library` deps, so the pip hubs
# stay empty and independent of them.
dependencies = ["mikemol-grade", "mikemol-bibparse", "mikemol-atomicwrite"]

[project.scripts]
# ⚑ `mikemol-verdict` is taken by mikemol.hooks.verdict, so this one carries the dist name.
mikemol-gradekit-verdict = "mikemol.gradekit.verdict:main"
mikemol-grades-rec = "mikemol.gradekit.grades_rec:main"
mikemol-read-grade = "mikemol.gradekit.read_grade:main"
mikemol-effective = "mikemol.gradekit.effective:main"

[project.urls]
Homepage = "https://github.com/mikemol/mtools"

[dependency-groups]
# ⚑ THE SAME THREE AS THE SIBLINGS (see ratchet/pyproject.toml).
dev = ["pytest", "mypy", "ruff==0.16.6"]

[tool.uv.sources]
mikemol-grade = { path = "../grade" }
mikemol-bibparse = { path = "../bibparse" }
mikemol-atomicwrite = { path = "../atomicwrite" }

[tool.setuptools.packages.find]
where = ["src"]
# ⚑⚑ NO `src/mikemol/__init__.py`: PEP 420 implicit namespace, shared with the siblings.
include = ["mikemol.*"]

[tool.setuptools.package-data]
"mikemol.gradekit" = ["py.typed"]

[tool.uv]
environments = ["sys_platform == 'linux'"]

[tool.pytest.ini_options]
empty_parameter_set_mark = "fail_at_collect"  # a parametrize that collects zero cases FAILS; it never reads as a skip (W88, arms in W90)
testpaths = ["tests"]
norecursedirs = ["bazel-*", ".venv", ".git", ".claude", "*.egg-info", "__pycache__"]  # backstop: with tests/ absent the runner falls back to rootdir and walks these (measured by linux-sources, W297)
addopts = "--strict-markers --strict-config"
markers = []

# ⚑⚑ THE SIBLINGS' FULL STRICT BLOCK, unchanged. See ratchet/pyproject.toml for why each key.
[tool.mypy]
strict = true
extra_checks = true
strict_equality = true
disallow_any_decorated = true
disallow_any_explicit = true
disallow_any_expr = true
python_version = "3.13"
warn_unused_ignores = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
files = ["src", "tests"]
mypy_path = "src"
explicit_package_bases = true

[tool.ruff]
line-length = 100
target-version = "py313"
namespace-packages = ["src/mikemol", "tests"]

[tool.ruff.lint]
preview = true
select = ["ALL"]
ignore = ["incorrect-blank-line-before-class", "multi-line-summary-second-line", "missing-trailing-comma"]

# ⚑ THE SIBLINGS ARE `mikemol.*` TOO. Without this, ruff sorts them as third-party when they are
# installed (the dev venv) and as first-party when they sit beside src (the Bazel sandbox), and
# the two disagree about the import block.
[tool.ruff.lint.isort]
known-first-party = ["mikemol"]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = true

# ⚑⚑ COPIED FROM ratchet/pyproject.toml, which carries the P/F arms this pattern was measured by.
# A TOML literal string: in a basic string `\.` is an invalid escape.
[tool.ruff.lint.flake8-copyright]
notice-rgx = '(?i)SPDX-License-Identifier: Apache-2\.0[ \t]*\n#[ \t]*Copyright \(c\) \d{4} Mike Mol'

# ⚑⚑ PER FILE, NEVER A GLOB. A `tests/*` entry would grant the next test module an exemption
# nobody chose for it; each line below is one module that needs it.
[tool.ruff.lint.per-file-ignores]
"tests/test_jsonio.py" = ["assert"]
"tests/test_cli.py" = ["assert"]
"tests/test_read_grade.py" = ["assert"]
"tests/test_grades_rec.py" = ["assert"]
"tests/test_effective.py" = ["assert"]
# ⚑ THE COHERENCE CELL RUNS A CHILD INTERPRETER ON A SCRIPT THE CALLER NAMES: the argv is
# `sys.executable` and paths, never a shell.
"src/mikemol/gradekit/verdict.py" = [
    "subprocess-without-shell-equals-true",
    "suspicious-subprocess-import",
]
"tests/test_verdict.py" = ["assert"]
