[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# ⚑⚑⚑ A NAMESPACE DISTRIBUTION, FOR DEPENDENCY ISOLATION (operator, 2026-08-31). The generic
# names are taken and would have been wrong anyway: `mdstruct` on PyPI is a markdown
# header-splitter — adjacent enough that sharing the name would confuse both — and `mtools` is
# MongoDB log tooling. Publishing under a personal namespace ends the race for generic words
# permanently, and the ISOLATION is the reason to prefer several distributions over one:
# a consumer wanting the markdown reader must not inherit `membudget`'s or `bibstruct`'s deps.
name = "mikemol-mdstruct"
version = "0.1.0"
description = "Structural reading and writing of markdown: header spans, tables, cells, and section rewrites over pandoc's AST."
readme = "README.md"
requires-python = ">=3.13"
authors = [{name = "Mike Mol"}]
license = "Apache-2.0"
keywords = ["markdown", "pandoc", "panflute", "structural", "ast", "sections"]
classifiers = [
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Typing :: Typed",
]

# ⚑ THE PARSER IS THE ONLY RUNTIME DEPENDENCY. `pandoc` itself is a SYSTEM binary this package
# invokes rather than a wheel it can require — declared in the README as a prerequisite, and
# every suite that needs it reports a DECLARED SKIP when it is absent rather than a silent pass.
dependencies = ["panflute"]

[project.urls]
Homepage = "https://github.com/mikemol/mtools"

# ⚑⚑ PYTEST, NOT THE `--selftest` PATTERN THIS CODE CAME FROM (operator, 2026-08-31). The origin
# repo runs suites through a roster that invokes each tool with `--selftest`, so every module
# carried its own runner and reported its own counts — a design that follows from being INVOKED
# rather than IMPORTED. A published library has no roster: a consumer running `pytest` expects
# discovery, fixtures, parametrization and a standard report, and shipping a bespoke protocol
# would make this package the only thing in their tree that does not answer to it.
#
# ⚑⚑⚑ AND `paperkit` IS A DEV DEPENDENCY, NOT A RUNTIME ONE. This package's WARRANTS are projected
# by paperkit — the claims in `warrants.bib` become both this distribution's gated checks and its
# prose document — but nothing a CONSUMER imports touches the engine. A consumer installing
# `mikemol-mdstruct` to parse markdown must not also pull a document projector.
#
# ⚑⚑ DECLARED AS A PUBLISHED PACKAGE, NEVER A PATH (operator: *"paperkit will be published as a
# package … Best to install paperkit into sandbox .venv in the same way"*). paperkit's own
# `tools/verb.bzl` records why the alternative fails: an EDITABLE install is a finder pointing at
# an absolute host path, and staged into a sandbox it resolves back OUT to the live working tree,
# so every check reads unstaged sources and reports green — *"a sandbox escape that passes is worse
# than one that fails"*. A published wheel is real files with a content hash and cannot do that.
[dependency-groups]
# ⚑ `mypy` IS A DEV DEPENDENCY BECAUSE `stubtest` IS PART OF IT, and the stub-authority witness
# runs it as a subprocess. Without it declared, that witness passed on a host whose venv happened
# to carry mypy and FAILED in the sandbox, which is the hermetic gate doing its job.
dev = ["pytest", "mypy", "paperkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# ⚑ `--strict-markers` MAKES A TYPO IN A MARKER AN ERROR rather than a silently unregistered
# one — the same class as a lint rule nobody declared: a test that claims a property nothing
# enforces reads as covered.
addopts = "--strict-markers --strict-config"
markers = [
    "needs_pandoc: requires the pandoc binary, which is a SYSTEM dependency and not a wheel",
]

[project.scripts]
# ⚑ THE CONSOLE SCRIPT IS THE ADOPTION PATH THAT REPLACES A SYMLINK. Peers previously adopted
# this tool by symlinking one file out of another repo's working tree — which broke silently the
# moment the tool derived its own root with `abspath(__file__)` (that does not resolve symlinks,
# so the root became the CONSUMER's repo). A published entry point cannot have that defect: an
# installed package knows where it lives.
mdstruct = "mikemol.mdstruct.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
# ⚑⚑ NO `src/mikemol/__init__.py`, DELIBERATELY — PEP 420 implicit namespace. That absence is
# what lets `mikemol-membudget` and `mikemol-bibstruct` install alongside this and share the
# `mikemol.` prefix without either owning it. An `__init__.py` here would make the first
# installed distribution the exclusive owner and the second one shadow it.
include = ["mikemol.*"]

[tool.setuptools.package-data]
# ⚑ `py.typed` SHIPS, so consumers get the annotations rather than `Any`. The tool this package
# came from had to write a STUB for every untyped dependency it used; shipping the marker is how
# this one avoids imposing that on its own consumers.
"mikemol.mdstruct" = ["py.typed"]

[tool.uv]
environments = ["sys_platform == 'linux'"]

# ⚑⚑⚑ THE BAR IS ADOPTED, NOT INVENTED. This ruleset is substrate's, which took it from
# linux-sources' measured config. Copying a bar that two repos already run beats writing a third
# one — and the reasoning below is kept because a bar without its argument is a bar that gets
# relaxed by the first person who finds it inconvenient.
[tool.mypy]
strict = true
extra_checks = true
strict_equality = true
disallow_any_decorated = true
disallow_any_explicit = true
# ⚑ `disallow_any_expr` IS THE FLAG THAT DOES THE WORK. It makes every untyped-boundary result
# POISON every downstream expression, forcing narrowing AT THE EDGE rather than carrying `Any`
# inward. Without it a corpus can be "typed on paper and Any in fact".
disallow_any_expr = true
python_version = "3.13"
# ⚑ AN IGNORE MUST BE BOTH CODED AND STILL LOAD-BEARING. This turns a suppression on a line the
# checker now types precisely into an ERROR, so the ignore set is exactly the flagged lines and
# self-corrects when a dependency's stubs improve.
warn_unused_ignores = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
# ⚑⚑ NO `[[tool.mypy.overrides]]` SECTION, DELIBERATELY — that is where a bar like this rots.
# One module gets exempted, the exemption outlives its reason, and the next reader cannot tell a
# carve-out from an abandonment. If something cannot be typed, that is a FINDING ABOUT THE
# DESIGN, not a category of code.
#
# ⚑ AND THE SCOPE IS THE WHOLE PACKAGE, WHICH IS THE POINT OF STARTING FRESH. Substrate scopes
# its gate to a growing frontier because its legacy corpus is large and dirty; this repo has no
# legacy, so the admitted set is everything from commit one.
files = ["src", "tests"]
# ⚑⚑⚑ `src` IS HERE BECAUSE ITS ABSENCE TYPED EVERY TEST AS `Any` WHILE THE SUITE PASSED. An
# editable install lands as a `.pth` plus an import-hook FINDER, and mypy reads the filesystem
# rather than running `sys.path` hooks — so `from mikemol.mdstruct import …` resolved at RUNTIME
# and not to the type checker. MEASURED: 90 tests green, and `mypy tests/test_frontmatter.py`
# reporting 14 errors, 13 of them `Any` from one unresolved import.
#
# ⚑⚑ AND IT WAS REPORTED AS "ruff+mypy clean" ON A `src`-ONLY RUN. **A passing test suite is a
# fact about the tests, never about the standard applied to them** — the same shape as a green
# census that measured nothing. Found only when the sibling distribution hit the identical wall
# and its errors were loud instead of silent.
#
# ⚑ `stubs` STAYS: it is the third-party surface, a different population from this package's own.
#
# ⚑⚑⚑ ⟡mtools-drop-mypypath, MEASURED — AND ITS TRIGGER WAS MIS-STATED. This pair was filed as
# retiring "when bazel runfiles resolve imports by layout". It does not, and bazel is not the
# variable. The variable is whether the install is EDITABLE, which is a property of the developer
# venv rather than of the build system. Measured against a fresh non-editable install of each
# distribution, with dev dependencies present and BOTH lines deleted:
#
#     hooks     Success: no issues found in 16 source files
#     ratchet   Success: no issues found in 8 source files
#     mdstruct  Success — but only with `mypy_path = "stubs"` retained
#
# ⚑⚑ SO TWO THIRDS OF THE PAIR IS RETIRABLE AND THE LAST THIRD IS NOT A WORKAROUND AT ALL.
# `explicit_package_bases` and the `src` entry exist because an editable install lands as a `.pth`
# plus an import-hook finder that mypy cannot see. A `stubs` entry exists because a stubs
# directory is not a package and there is no install to be found through — that one is permanent,
# and calling it temporary was a category error.
#
# ⚑⚑ THE PAIR STAYS, AND THAT IS A DECISION RATHER THAN AN OMISSION. Flipping the venvs to
# non-editable would retire it and BREAK THE DEV LOOP: measured, an installed copy does not see a
# source edit, so every change would need a reinstall before any checker saw it. Trading a
# documented two-line config for a reinstall on every edit is a worse repository, and the ticket's
# premise — that this is temporary scaffolding awaiting bazel — is now known to be false.
# ⟡mtools-drop-mypypath is CLOSED as won't-fix, with the measurement above as its warrant.
mypy_path = "src:stubs"
# ⚑ AND THE PAIR IS ONE SETTING IN TWO KEYS. With `src` a search root, a module is reachable as
# both `mikemol.mdstruct.x` and `mdstruct.x`, which mypy refuses; this says the name derives from
# the declared roots. Either key alone leaves a working-LOOKING config that checks nothing or
# aborts before it starts.
explicit_package_bases = true

[tool.ruff]
line-length = 100
target-version = "py313"
# ⚑⚑⚑ THE NAMESPACE IS DECLARED, NOT SUPPRESSED. `INP001` fires on a directory without an
# `__init__.py` because that is usually an oversight — and here it is the design: `src/mikemol/`
# must stay empty of one so sibling distributions can share the prefix. The rule offers exactly
# this option for the deliberate case, so the answer is to TELL it rather than to ignore the
# rule and lose it everywhere else in the tree.
#
# ⚑ AND THE DISTINCTION IS WORTH THE LINE: with this, a MISSING `__init__.py` anywhere else is
# still a finding. An `ignore = ["INP001"]` would have bought the same silence at the cost of
# never hearing about a real oversight again.
namespace-packages = ["src/mikemol", "tests"]

[tool.ruff.lint]
# ⚑ EVERY RULE. A curated subset silently omits whole families and nothing says which — a reader
# cannot distinguish "we considered this and declined" from "we never knew it existed". `ALL`
# makes every omission an explicit entry below.
select = ["ALL"]
# ⚑ ruff's OWN MUTUALLY-EXCLUSIVE PAIRS. Each cannot both be satisfied, so ruff requires picking
# one; these are not judgement calls.
#
# ⚑⚑ CPY001 IS ABSENT FROM THIS LIST, UNLIKE UPSTREAM — because this repo HAS a license
# (Apache-2.0, declared above), so the copyright-header rule is a real gate here rather than a
# licensing decision a linter would be making on the operator's behalf.
ignore = ["D203", "D213", "COM812"]

# ⚑⚑ THE PATTERN IS STRICTER THAN ITS PROSE, AND DELIBERATELY. "Carry the two-line header"
# underspecifies it: this also fixes ORDER (SPDX first), ADJACENCY, the `#` prefix on the
# copyright line, and a 4-digit year. A file with both lines in the wrong order fails while
# looking correct to a reader — so the intake documentation must state the shape, not the gist.
#
# ⚑⚑ VERIFY THIS LINE WITH `ruff check --show-settings | grep notice_rgx`, NEVER BY READING IT.
# Reading the line you just wrote shows INTENT; --show-settings shows EFFECT. The string must be
# a TOML *literal* (single quotes): in a basic string `\.` is an invalid escape and `\\.` means
# backslash-dot, so a double-quoted version resolves to a regex that CANNOT MATCH — a gate that
# reads as adopted, passes every file, and is inert. Measured: written double-quoted here first,
# caught by --show-settings before it was armed.
#
# ⚑ `[ \t]*` AND NOT `\s*`, because `\s` matches newlines. With `\s*` the gate silently ACCEPTED
# a blank line between the two notices while REJECTING a `#` line between them — an inconsistency
# no reader predicts from the regex or its description. Found by cassian-observability, which
# tested its own migrating files against this pattern rather than accepting an assurance that
# they passed; the probe surfaced a defect in THIS config, not in cassian's files.
#
# ⚑ A THIRD CASE, and no F-arm reaches it: A REPORTED CONVENTION WITH NO POPULATION. substrate
# supplied this exact header form as its practice, cited from one file. Censused:
# `pycodemod --literal 'SPDX-License-Identifier' substrate/` → 0 sites in 0 of 556 files. The
# convention was inferred from a single witness and never censused; nothing fires because nothing
# exists, and the report is the only artifact. The discriminating act is not an arm but a CENSUS,
# and it costs one command.
#
# ⚑⚑⚑ AND THAT CENSUS WAS ALSO VOID — RETRACTED BY ITS AUTHOR, AND THE RETRACTION IS WORTH MORE
# THAN THE FIGURE. `pycodemod --literal` searches STRING CONSTANTS; a licence header is a COMMENT.
# The reader could never have seen a header anywhere in that tree, in either direction. So the
# zero was a fact about the READER, and so was the correction that followed it: the peer then
# found a conforming header by eye and was about to report "zero under one subtree, not zero
# repo-wide" — a second wrong number from the same blind instrument.
#
# ⚑⚑ THE LAYER THIS ADDS TO THE ONE ABOVE. A report with no census is the third case. A census
# run with a reader that cannot perceive the thing censused is the FOURTH, and it is worse,
# because it produces a NUMBER — and a number ends the question. Both of the peer's readings
# were disciplined, both were sourced to a command, and both were void for one reason neither
# reading could surface. ⚑ THE ZERO AND ITS CORRECTION FAILED TOGETHER: re-running a blind
# instrument in the other direction cannot detect blindness.
#
# ⚑⚑⚑ THE CENSUS THEN RAN, AND IT REVERSES THE INTAKE CONSEQUENCE. Four readings were reported
# for one population, in order: zero repo-wide; zero under the promoted tree only; UNMEASURED;
# and finally, from the purpose-built prologue reader, 431 of 568 promoted files carrying BOTH
# lines. THE TREE NAMED AS EMPTY WAS THE MOST CONFORMING ONE IN THE REPOSITORY. A reader that
# cannot see its subject returns the same answer as an absent subject, and nothing in its output
# separates the two — it read zero for the tree at 431 exactly as it read zero for the trees
# genuinely at zero.
#
# ⚑⚑ VERIFIED HERE AGAINST THIS GATE RATHER THAN TAKEN ON REPORT, because the peer correctly
# flagged the question it had NOT asked: whether those headers carry the identifier THIS config
# matches, as opposed to merely having both lines. Running the `notice-rgx` above over a copy of
# that tree: 137 refusals in 568 files — the exact complement of the peer's 431, from an
# independent instrument reading a different property. Two readers partitioning one population
# identically is the strongest available evidence that neither is blind. The identifier census
# agrees: 480 occurrences of `Apache-2.0` and 480 of `Copyright (c) 2026 Mike Mol`, zero variants.
#
# ⚑ AND ZERO PARTIALS ACROSS 1447 FILES — no file carries one line without the other. That is a
# negative result from an instrument built to be able to report otherwise: the peer's reader keeps
# SPDX and copyright as two independent facts precisely because a single `has_header` boolean
# would reproduce the mirror-image blind spot recorded above and be unable to report a half-header
# at all. The defect this config was widened to catch does not occur in that population.
#
# Consequence for intake, CORRECTED AND NOW MEASURED: substrate-derived code mostly arrives WITH
# conforming headers, and the earlier "arrives without headers" cost is withdrawn. The 137 sit in
# trees whose non-promoted status is what makes them non-candidates. The gate's requirement is
# unchanged either way: the header is a precondition of admission rather than a follow-up.
#
# ⚑⚑ THE GATE IS MEASURED ON THE VERSION THE LOCK INSTALLS, NOT ONLY THE ONE IN THE VENV. The
# `requirements.txt` beside this file pinned ruff 0.16.6 while the working venv ran 0.16.5 — so
# every arm below had been measured on a version bazel would NOT install. Resolved by installing
# the pinned version and re-running the whole matrix: identical results on both, corpus clean on
# both, all 140 warrant checks passing on both. The drift was benign; that it was UNMEASURED was
# not, and a rule set is a property of the resolver rather than of the config text.
#
# ⚑⚑⚑ F-ARMED PER PROPOSITION, NOT PER RULE. A configured-but-inert gate is the EASY case: it
# fires on nothing and someone eventually notices. AN ACTIVE GATE AIMED AT THE WRONG PREDICATE is
# the hard case — it produces findings, passes review, and its greens are indistinguishable from
# correct ones. This repo and linux-sources were MIRROR IMAGES of that: this notice-rgx matched
# SPDX only, its unset default matched `Copyright` only, so neither repo gated both lines and each
# party ran the arm its own config would pass. The arms below must all be re-run on any edit:
#
#   P1 intact          passes      F1 no SPDX          FIRES     F4 blank line between  FIRES
#   P2 shebang first   passes      F2 no copyright     FIRES     F5 `#` line between    FIRES
#   P3 year 2031       passes      F3 reversed order   FIRES     F6 wrong holder        FIRES
#
# P2 keeps codemod_header.py working (a `#!` not on line 1 stops being a shebang, so the notice
# follows it). P3 keeps the year `\d{4}` rather than literal 2026: a copyright year is the year of
# AUTHORSHIP, so a later file carries a later year without a config change. And the P arms are not
# decoration — without them, "every F arm fires" is indistinguishable from a gate refusing
# everything.
[tool.ruff.lint.flake8-copyright]
notice-rgx = '(?i)SPDX-License-Identifier: Apache-2\.0[ \t]*\n#[ \t]*Copyright \(c\) \d{4} Mike Mol'

# ⚑⚑⚑ THE TWO CHECKERS DISAGREE HERE, AND THIS IS THE ARBITRATION. `PT001` prefers a bare
# `@pytest.fixture`; mypy cannot pick an overload from the bare form, so the decorated function
# collapses to `Any` and takes the fixture's return type with it — every consuming test then
# reads an untyped value while looking perfectly annotated. **A silent `Any` outranks a style
# preference**, so the called form wins and ruff is TOLD, not suppressed.
#
# ⚑ TOLD RATHER THAN IGNORED, for the same reason as `namespace-packages`: an
# `ignore = ["PT001"]` buys the same silence while also accepting the INCONSISTENT spelling
# everywhere. This keeps the rule enforcing, with the other setting.
[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = true

[tool.ruff.lint.per-file-ignores]
# ⚑ `assert` IS THE TEST IDIOM AND `-O` NEVER RUNS THESE. S101 bans `assert` because it vanishes
# under `-O`; a test run is never invoked that way. Scoped to the test path rather than granted
# as a blanket, because it would NOT be safe for library code.
"tests/*" = ["S101"]

# ⚑ RUNNING A CHECKER IS ONE MODULE'S ONE RESPONSIBILITY, and this file's is stubtest. The
# exemption is scoped to the file rather than to `tests/*`, so a future test that shells out
# is a finding rather than an inheritance.
"tests/test_stub_authority.py" = ["S404", "S603"]

# ⚑ RUNNING PANDOC IS ONE MODULE'S ONE RESPONSIBILITY. The `S603` exemption a subprocess needs is
# granted per FILE, so a module that also parsed or rendered would extend it over those concerns
# too — which is precisely why this package is one module per concern. The argv is `pandoc` plus
# format names from a fixed vocabulary; the document travels on stdin as data and never becomes a
# word in the command.
"src/mikemol/mdstruct/pandoc.py" = ["S603"]
