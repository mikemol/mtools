[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mikemol-waldo"
version = "0.1.0"
description = "Waldo: a narrow tool that holds one privilege and does only a declared action, with a declared allowed set, refuse-with-diff, same-plan apply and witnesses."
readme = "README.md"
requires-python = ">=3.13"
authors = [{name = "Mike Mol"}]
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["waldo"]
classifiers = [
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

# ⚑ NO RUNTIME DEPENDENCY: standard library only.
dependencies = []

[project.urls]
Homepage = "https://github.com/mikemol/mtools"

[dependency-groups]
dev = ["pytest", "mypy", "ruff==0.16.6"]

[tool.setuptools.packages.find]
where = ["src"]
# ⚑⚑ NO `src/mikemol/__init__.py`: PEP 420 implicit namespace, shared with the siblings.
include = ["mikemol.*"]

[tool.setuptools.package-data]
"mikemol.waldo" = ["py.typed"]

[tool.uv]
environments = ["sys_platform == 'linux'"]

[tool.pytest.ini_options]
empty_parameter_set_mark = "fail_at_collect"  # a parametrize that collects zero cases FAILS; it never reads as a skip (W88, arms in W90)
testpaths = ["tests"]
norecursedirs = ["bazel-*", ".venv", ".git", ".claude", "*.egg-info", "__pycache__"]  # backstop: with tests/ absent the runner falls back to rootdir and walks these (measured by linux-sources, W297)
addopts = "--strict-markers --strict-config"
markers = []

# ⚑⚑ THE SIBLINGS' FULL STRICT BLOCK, unchanged. See ratchet/pyproject.toml for why each key.
[tool.mypy]
strict = true
extra_checks = true
strict_equality = true
disallow_any_decorated = true
disallow_any_explicit = true
disallow_any_expr = true
python_version = "3.13"
warn_unused_ignores = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
files = ["src", "tests"]
mypy_path = "src"
explicit_package_bases = true

[tool.ruff]
line-length = 100
target-version = "py313"
namespace-packages = ["src/mikemol", "tests"]

[tool.ruff.lint]
preview = true
select = ["ALL"]
ignore = [
    "incorrect-blank-line-before-class",
    "multi-line-summary-second-line",
    "missing-trailing-comma",
    # CODON REJECTS A BARE `*,` AND A TYPE_CHECKING GUARD (mtools:W1319, W1340, W1343): the rules
    # that demand them are off for this dist.
    "boolean-default-value-positional-argument",
    "boolean-type-hint-positional-argument",
]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = true

# ⚑⚑ COPIED FROM ratchet/pyproject.toml, which carries the P/F arms this pattern was measured by.
# A TOML literal string: in a basic string `\.` is an invalid escape.
[tool.ruff.lint.flake8-copyright]
notice-rgx = '(?i)SPDX-License-Identifier: Apache-2\.0[ \t]*\n#[ \t]*Copyright \(c\) \d{4} Mike Mol'

# ⚑⚑ PER FILE, NEVER A GLOB. A `tests/*` entry would grant the next test module an exemption
# nobody chose for it; each line below is one module that needs it.
[tool.ruff.lint.per-file-ignores]
"tests/test_compare.py" = ["assert"]
"tests/test_witness.py" = ["assert"]
"tests/test_contract.py" = ["assert"]
"tests/test_custody.py" = ["assert"]
"tests/test_unevaluated.py" = ["assert"]
"tests/test_pipeline.py" =["assert"]
"tests/test_marker.py" = ["assert"]
"tests/test_confirm.py" = ["assert"]
"tests/test_phases.py" = ["assert"]
"tests/test_runphase.py" = ["assert"]
"tests/test_act.py" = ["assert"]
"tests/test_cli.py" = ["assert"]
"tests/test_planconfig.py" = ["assert"]
"tests/test_planopa.py" = ["assert"]
"tests/test_planjson.py" = ["assert"]
"tests/test_planverdict.py" = ["assert"]
"tests/test_planeval.py" = ["assert"]
"tests/test_planledger.py" = ["assert"]
"tests/test_planwitness.py" = ["assert"]
"tests/test_planprecond.py" = ["assert"]
"tests/test_planplan.py" = ["assert"]
"tests/test_planflow.py" = ["assert"]
"tests/test_plancli.py" = ["assert"]
"tests/test_planinterlock.py" = ["assert"]
