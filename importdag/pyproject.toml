[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# ⚑ paperkit's `dagderive`, `dagnames` and `closure_census` moved first (mtools:W563, a cut of W532);
# `imports`, `closure` and `dagbzl` followed (mtools:W547) once the sibling edge was ruled (W562).
name = "mikemol-importdag"
version = "0.1.0"
description = "Derive a project's import DAG, name its modules importably, and census witnesses that reach the engine through a subprocess."
readme = "README.md"
requires-python = ">=3.13"
authors = [{name = "Mike Mol"}]
license = "Apache-2.0"
keywords = ["import-graph", "dag", "paperkit"]
classifiers = [
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

# ⚑ THE FIRST DIST-TO-DIST EDGE (mtools:W562, ruled A+B by the operator 2026-10-04): the sibling write helper,
# resolved by uv as a NON-editable path source (an editable install installs a finder hook that mypy cannot
# resolve). Bazel carries the same edge as a py_library dependency in BUILD.bazel; the pip hubs do not
# resolve it, and requirements.txt is deliberately NOT regenerated (a path source writes a bare relative line
# that breaks the pip extension for every dist). The two declarations are kept in step by hand.
dependencies = ["mikemol-atomicwrite"]

[project.scripts]
mikemol-dagnames = "mikemol.importdag.dagnames:main"
mikemol-closure-census = "mikemol.importdag.closure_census:main"
mikemol-closure = "mikemol.importdag.closure:main"
mikemol-imports = "mikemol.importdag.imports:main"
mikemol-dagbzl = "mikemol.importdag.dagbzl:main"

[project.urls]
Homepage = "https://github.com/mikemol/mtools"

[dependency-groups]
# ⚑ THE SAME THREE AS THE SIBLINGS (see ratchet/pyproject.toml).
dev = ["pytest", "mypy", "ruff==0.16.6"]

[tool.setuptools.packages.find]
where = ["src"]
# ⚑⚑ NO `src/mikemol/__init__.py`: PEP 420 implicit namespace, shared with the siblings.
include = ["mikemol.*"]

[tool.setuptools.package-data]
"mikemol.importdag" = ["py.typed"]

[tool.uv]
environments = ["sys_platform == 'linux'"]

[tool.uv.sources]
mikemol-atomicwrite = { path = "../atomicwrite" }

[tool.pytest.ini_options]
empty_parameter_set_mark = "fail_at_collect"  # a parametrize that collects zero cases FAILS; it never reads as a skip (W88, arms in W90)
testpaths = ["tests"]
norecursedirs = ["bazel-*", ".venv", ".git", ".claude", "*.egg-info", "__pycache__"]  # backstop: with tests/ absent the runner falls back to rootdir and walks these (measured by linux-sources, W297)
addopts = "--strict-markers --strict-config"
markers = []

# ⚑⚑ THE SIBLINGS' FULL STRICT BLOCK, unchanged. See ratchet/pyproject.toml for why each key.
[tool.mypy]
strict = true
extra_checks = true
strict_equality = true
disallow_any_decorated = true
disallow_any_explicit = true
disallow_any_expr = true
python_version = "3.13"
warn_unused_ignores = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
files = ["src", "tests"]
mypy_path = "src"
explicit_package_bases = true

[tool.ruff]
line-length = 100
target-version = "py313"
namespace-packages = ["src/mikemol", "tests"]

[tool.ruff.lint]
preview = true
select = ["ALL"]
ignore = ["incorrect-blank-line-before-class", "multi-line-summary-second-line", "missing-trailing-comma"]

# ⚑ THE SIBLING IS THIRD-PARTY TO THIS DISTRIBUTION, in the editor and in the sandbox alike. Left to
# detection, a venv that has the sibling installed classifies `mikemol.atomicwrite` with this
# package's own imports, while the sandbox (no venv) puts it in its own block: the ratchet and the
# per-edit hook then demand opposite layouts of the same file (mtools:W547).
[tool.ruff.lint.isort]
known-third-party = ["mikemol.atomicwrite"]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = true

# ⚑⚑ COPIED FROM ratchet/pyproject.toml, which carries the P/F arms this pattern was measured by.
# A TOML literal string: in a basic string `\.` is an invalid escape.
[tool.ruff.lint.flake8-copyright]
notice-rgx = '(?i)SPDX-License-Identifier: Apache-2\.0[ \t]*\n#[ \t]*Copyright \(c\) \d{4} Mike Mol'

# ⚑⚑ PER FILE, NEVER A GLOB. A `tests/*` entry would grant the next test module an exemption
# nobody chose for it; each line below is one module that needs it.
[tool.ruff.lint.per-file-ignores]
"tests/test_sibling_edge.py" = ["assert"]
"tests/test_dagderive.py" = ["assert"]
# ⚑ THE RESOLVER'S WITNESSES ARE PLAIN ASSERTS OVER PURE FUNCTIONS (and one tmp_path read): no child
# process, so `assert` is the only exemption it needs.
"tests/test_resolve.py" = ["assert"]
"tests/test_resolve_init.py" = ["assert"]
"tests/test_split.py" = ["assert"]
# ⚑ THE THREE PORTED TOOLS (mtools:W547). `closure` is exercised as `python -m` in a child as well as
# by calls; `imports` and `dagbzl` are the two DAG-file writers, and their exit codes are contracts.
"tests/test_closure.py" = [
    "assert",
    "subprocess-without-shell-equals-true",
    "suspicious-subprocess-import",
]
"tests/test_imports.py" = [
    "assert",
    "subprocess-without-shell-equals-true",
    "suspicious-subprocess-import",
]
"tests/test_dagbzl.py" = [
    "assert",
    "subprocess-without-shell-equals-true",
    "suspicious-subprocess-import",
]
# ⚑ ITS WITNESSES RUN THE CENSUS AS `python -m` IN A CHILD: the exit code is the contract.
"tests/test_closure_census.py" = [
    "assert",
    "subprocess-without-shell-equals-true",
    "suspicious-subprocess-import",
]
# ⚑ THE NAME CHECK'S ONE RESPONSIBILITY IS TO RUN A CHILD INTERPRETER: a module imported into the
# checking process would poison the answer for the next name. The argv is `sys.executable`, `-c`
# and a literal, never a shell.
"src/mikemol/importdag/dagnames.py" = [
    "subprocess-without-shell-equals-true",
    "suspicious-subprocess-import",
]
# ⚑ THE CENSUS ASKS the closure tool (this distribution's `closure` module, or a script standing in
# for it) what roots a claim gets, as a child process. Same argv shape: `sys.executable` and paths.
"src/mikemol/importdag/closure_census.py" = [
    "subprocess-without-shell-equals-true",
    "suspicious-subprocess-import",
]
# ⚑ ITS WITNESSES RUN A REAL CHILD INTERPRETER, because the defect under test is what a fresh
# process can import.
"tests/test_dagnames.py" = [
    "assert",
    "subprocess-without-shell-equals-true",
    "suspicious-subprocess-import",
]
