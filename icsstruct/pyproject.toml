[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# ⚑⚑⚑ NO ICALENDAR LIBRARY IS LOSSLESS. `icalendar`'s parser either raises on a malformed line or
# skips it silently, depending on its strictness mode, so a count over its output is not a count
# over the input (.claude/design/W247-icsstruct.md). Asked for by life (life:W13) for life and
# nemik. Stage 1 is `lexical`: every physical line of a `.ics` lands in exactly one record.
name = "mikemol-icsstruct"
version = "0.1.0"
description = "iCalendar read losslessly: every physical line in exactly one record, components nested, malformed lines reported with a reason rather than dropped."
readme = "README.md"
requires-python = ">=3.13"
authors = [{name = "Mike Mol"}]
license = "Apache-2.0"
keywords = ["icalendar", "ics", "rfc5545", "calendar", "lossless"]
classifiers = [
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Scheduling",
    "Typing :: Typed",
]

# ⚑ THE LEXICAL LAYER NEEDS NEITHER: it is RFC 5545 §3.1 and the standard library. These two are
# the recurrence expander, and only well-formed VEVENTs reach them. Both are typed through
# `stubs/` (W258), because one carries `Any` and the other ships no py.typed.
dependencies = ["icalendar", "recurring-ical-events"]

[project.urls]
Homepage = "https://github.com/mikemol/mtools"

[dependency-groups]
# ⚑ THE SAME THREE AS THE SIBLINGS, for the same reasons (see ratchet/pyproject.toml): mypy and
# pytest are staged by the bazel mypy action, and `.githooks/pre-commit` refuses without ruff.
dev = ["pytest", "mypy", "ruff==0.16.6"]

[tool.setuptools.packages.find]
where = ["src"]
# ⚑⚑ NO `src/mikemol/__init__.py` — PEP 420 implicit namespace, shared with the siblings.
include = ["mikemol.*"]

[tool.setuptools.package-data]
"mikemol.icsstruct" = ["py.typed"]

[tool.uv]
environments = ["sys_platform == 'linux'"]

[tool.pytest.ini_options]
empty_parameter_set_mark = "fail_at_collect"  # a parametrize that collects zero cases FAILS; it never reads as a skip (W88, arms in W90)
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
# ⚑ NO MARKERS. Every fixture is synthetic (life 4a652ec, UIDs @life.invalid); nothing needs a
# host or a skip.
markers = []

# ⚑⚑ THE SIBLINGS' FULL STRICT BLOCK, unchanged. See ratchet/pyproject.toml for why each key.
[tool.mypy]
strict = true
extra_checks = true
strict_equality = true
disallow_any_decorated = true
disallow_any_explicit = true
disallow_any_expr = true
python_version = "3.13"
warn_unused_ignores = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
files = ["src", "tests"]
mypy_path = "src:stubs"
explicit_package_bases = true

[tool.ruff]
line-length = 100
target-version = "py313"
namespace-packages = ["src/mikemol", "tests"]

[tool.ruff.lint]
preview = true
select = ["ALL"]
ignore = ["incorrect-blank-line-before-class", "multi-line-summary-second-line", "missing-trailing-comma"]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = true

# ⚑⚑ COPIED FROM ratchet/pyproject.toml, which carries the P/F arms this pattern was measured by.
# A TOML literal string: in a basic string `\.` is an invalid escape.
[tool.ruff.lint.flake8-copyright]
notice-rgx = '(?i)SPDX-License-Identifier: Apache-2\.0[ \t]*\n#[ \t]*Copyright \(c\) \d{4} Mike Mol'

# ⚑⚑ PER FILE, NEVER A GLOB. A `tests/*` entry would grant the next test module an exemption
# nobody chose for it; each line below is one module that needs it.
[tool.ruff.lint.per-file-ignores]
"tests/test_lexical.py" = ["assert"]
"tests/test_expand.py" = ["assert"]
"tests/test_stub_authority.py" = ["assert", "suspicious-subprocess-import", "subprocess-without-shell-equals-true"]
