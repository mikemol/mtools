[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mikemol-otlp"
version = "0.1.0"
description = "Build OTLP protobuf metric and log payloads from the published opentelemetry-proto wheels and send them to a named endpoint."
readme = "README.md"
requires-python = ">=3.13"
authors = [{name = "Mike Mol"}]
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["otlp"]
classifiers = [
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

# ⚑ ONE RUNTIME DEPENDENCY, the published opentelemetry-proto wheel (protobuf comes with it), pinned
# exactly with hashes in uv.lock: the payload builders fill its messages instead of hand-encoding.
dependencies = ["opentelemetry-proto==1.45.1"]

[project.scripts]
mikemol-otlp = "mikemol.otlp.cli:main"

[project.urls]
Homepage = "https://github.com/mikemol/mtools"

[dependency-groups]
dev = ["pytest", "mypy", "ruff==0.16.6"]

[tool.setuptools.packages.find]
where = ["src"]
# ⚑⚑ NO `src/mikemol/__init__.py`: PEP 420 implicit namespace, shared with the siblings.
include = ["mikemol.*"]

[tool.setuptools.package-data]
"mikemol.otlp" = ["py.typed"]

[tool.uv]
environments = ["sys_platform == 'linux'"]

[tool.pytest.ini_options]
empty_parameter_set_mark = "fail_at_collect"  # a parametrize that collects zero cases FAILS; it never reads as a skip (W88, arms in W90)
testpaths = ["tests"]
norecursedirs = ["bazel-*", ".venv", ".git", ".claude", "*.egg-info", "__pycache__"]  # backstop: with tests/ absent the runner falls back to rootdir and walks these (measured by linux-sources, W297)
addopts = "--strict-markers --strict-config"
markers = []

# ⚑⚑ THE SIBLINGS' FULL STRICT BLOCK, unchanged. See ratchet/pyproject.toml for why each key.
[tool.mypy]
strict = true
extra_checks = true
strict_equality = true
disallow_any_decorated = true
disallow_any_explicit = true
disallow_any_expr = true
python_version = "3.13"
warn_unused_ignores = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
files = ["src", "tests"]
# ⚑ `stubs` IS THE THIRD-PARTY SURFACE (as in treeio and mdstruct): the bazel mypy runner cannot see
# runtime dependencies, so the opentelemetry-proto messages this dist builds are declared there.
mypy_path = "src:stubs"
explicit_package_bases = true

[tool.ruff]
line-length = 100
target-version = "py313"
namespace-packages = ["src/mikemol", "tests"]

[tool.ruff.lint]
preview = true
select = ["ALL"]
ignore = [
    "incorrect-blank-line-before-class",
    "multi-line-summary-second-line",
    "missing-trailing-comma",
    # ⚑ CODON REJECTS A BARE `*,` (mtools:W1340): the keyword-only marker that kept a boolean out of
    # the positional slot is gone, so the rules that demand it are off for this dist.
    "boolean-type-hint-positional-argument",
    "boolean-default-value-positional-argument",
]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = true

# ⚑⚑ COPIED FROM ratchet/pyproject.toml, which carries the P/F arms this pattern was measured by.
# A TOML literal string: in a basic string `\.` is an invalid escape.
[tool.ruff.lint.flake8-copyright]
notice-rgx = '(?i)SPDX-License-Identifier: Apache-2\.0[ \t]*\n#[ \t]*Copyright \(c\) \d{4} Mike Mol'

# ⚑⚑ PER FILE, NEVER A GLOB. A `tests/*` entry would grant the next test module an exemption
# nobody chose for it; each line below is one module that needs it.
[tool.ruff.lint.per-file-ignores]
# ⚑ THE STUBS MIRROR A THIRD-PARTY API'S OWN SPELLINGS (as treeio's pygit2 stub does): protobuf's
# CamelCase methods and the Metric message's `sum` field are the wheel's names, not ours.
"stubs/google/protobuf/json_format.pyi" = ["invalid-function-name"]
"stubs/opentelemetry/proto/collector/metrics/v1/metrics_service_pb2.pyi" = ["invalid-function-name"]
"stubs/opentelemetry/proto/collector/logs/v1/logs_service_pb2.pyi" = ["invalid-function-name"]
"stubs/opentelemetry/proto/collector/trace/v1/trace_service_pb2.pyi" = ["invalid-function-name"]
"stubs/opentelemetry/proto/metrics/v1/metrics_pb2.pyi" = ["builtin-argument-shadowing"]
"tests/test_cli.py" = ["assert"]
"tests/test_endpoints.py" = ["assert"]
"tests/test_logs.py" = ["assert"]
"tests/test_sender.py" = ["assert"]
"tests/test_metriccmd.py" = ["assert"]
"tests/test_spans.py" = ["assert"]
"tests/test_tracecmd.py" = ["assert"]
"tests/test_smoke.py" = ["assert"]
"tests/test_metrics.py" = ["assert"]
