[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# ⚑ THE LAYOUT PATHFINDER for migrating paperkit's tools/ into mtools (mtools:W542, paperkit:W142,
# umbrella mtools:W531). Three Bazel packaging actions, stdlib only at runtime: `wheel` (builds
# and installs the engine wheel), `pyc` (one .py to an UNCHECKED_HASH .pyc), `pyinfo`.
name = "mikemol-pkgbuild"
version = "0.1.0"
description = "Bazel packaging actions: build and install a wheel, compile one .py to a .pyc, name the interpreter."
readme = "README.md"
requires-python = ">=3.13"
authors = [{name = "Mike Mol"}]
license = "Apache-2.0"
keywords = ["bazel", "wheel", "pyc", "packaging"]
classifiers = [
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

# ⚑ NO RUNTIME DEPENDENCY. `wheel build` calls the DECLARED PEP 517 backend (setuptools), which
# the Bazel action stages itself; it is imported lazily and only by `build`. `install`, `pyc`
# and `pyinfo` are standard library. setuptools is therefore a dev dependency (the tests build
# a wheel), not a shipping one.
dependencies = []

[project.scripts]
mikemol-wheel = "mikemol.pkgbuild.wheel:main"
mikemol-pyc = "mikemol.pkgbuild.pyc:main"
mikemol-pyinfo = "mikemol.pkgbuild.pyinfo:main"

[project.urls]
Homepage = "https://github.com/mikemol/mtools"

[dependency-groups]
# ⚑ THE SAME THREE AS THE SIBLINGS (see ratchet/pyproject.toml), plus setuptools: the wheel
# tests drive the real backend.
dev = ["pytest", "mypy", "ruff==0.16.6", "setuptools>=68"]

[tool.setuptools.packages.find]
where = ["src"]
# ⚑⚑ NO `src/mikemol/__init__.py`: PEP 420 implicit namespace, shared with the siblings.
include = ["mikemol.*"]

[tool.setuptools.package-data]
"mikemol.pkgbuild" = ["py.typed"]

[tool.uv]
environments = ["sys_platform == 'linux'"]

[tool.pytest.ini_options]
empty_parameter_set_mark = "fail_at_collect"  # a parametrize that collects zero cases FAILS; it never reads as a skip (W88, arms in W90)
testpaths = ["tests"]
norecursedirs = ["bazel-*", ".venv", ".git", ".claude", "*.egg-info", "__pycache__"]  # backstop: with tests/ absent the runner falls back to rootdir and walks these (measured by linux-sources, W297)
addopts = "--strict-markers --strict-config"
markers = []

# ⚑⚑ THE SIBLINGS' FULL STRICT BLOCK, unchanged. See ratchet/pyproject.toml for why each key.
[tool.mypy]
strict = true
extra_checks = true
strict_equality = true
disallow_any_decorated = true
disallow_any_explicit = true
disallow_any_expr = true
python_version = "3.13"
warn_unused_ignores = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
files = ["src", "tests"]
mypy_path = "src"
explicit_package_bases = true

[tool.ruff]
line-length = 100
target-version = "py313"
namespace-packages = ["src/mikemol", "tests"]

[tool.ruff.lint]
preview = true
select = ["ALL"]
ignore = ["incorrect-blank-line-before-class", "multi-line-summary-second-line", "missing-trailing-comma"]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = true

# ⚑⚑ COPIED FROM ratchet/pyproject.toml, which carries the P/F arms this pattern was measured by.
# A TOML literal string: in a basic string `\.` is an invalid escape.
[tool.ruff.lint.flake8-copyright]
notice-rgx = '(?i)SPDX-License-Identifier: Apache-2\.0[ \t]*\n#[ \t]*Copyright \(c\) \d{4} Mike Mol'

# ⚑⚑ PER FILE, NEVER A GLOB. A `tests/*` entry would grant the next test module an exemption
# nobody chose for it; each line below is one module that needs it.
[tool.ruff.lint.per-file-ignores]
"tests/test_wheel.py" = ["assert"]
"tests/test_pyc.py" = ["assert"]
"tests/test_pyinfo.py" = ["assert"]
