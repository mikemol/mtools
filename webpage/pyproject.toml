[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mikemol-webpage"
version = "0.1.0"
description = "Browser-test waits that end on the page's own event and never a wall-clock bound, and the codemod that moves Playwright waits onto them"
readme = "README.md"
requires-python = ">=3.13"
authors = [{name = "Mike Mol"}]
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["webpage"]
classifiers = [
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

# ⚑ NO RUNTIME DEPENDENCY: standard library only.
dependencies = []

[project.scripts]
# W1684: nemik's webpage_waits codemod (nemik:W706, W717): dry run unless --write, --adopt for webpage.until.
mikemol-webpage-waits = "mikemol.webpage.waits:main"

[project.urls]
Homepage = "https://github.com/mikemol/mtools"

[dependency-groups]
# ⚑ playwright IS EXACT (W1818, nemik:W717): the probes are facts about one browser driven by one
# client, and nemik's uv.lock holds 1.63.0, whose wheel expects chromium_headless_shell-1243.
dev = ["pytest", "mypy", "ruff==0.16.6", "playwright==1.63.0"]

[tool.setuptools.packages.find]
where = ["src"]
# ⚑⚑ NO `src/mikemol/__init__.py`: PEP 420 implicit namespace, shared with the siblings.
include = ["mikemol.*"]

[tool.setuptools.package-data]
"mikemol.webpage" = ["py.typed"]

[tool.uv]
environments = ["sys_platform == 'linux'"]

[tool.pytest.ini_options]
empty_parameter_set_mark = "fail_at_collect"  # a parametrize that collects zero cases FAILS; it never reads as a skip (W88, arms in W90)
testpaths = ["tests"]
norecursedirs = ["bazel-*", ".venv", ".git", ".claude", "*.egg-info", "__pycache__"]  # backstop: with tests/ absent the runner falls back to rootdir and walks these (measured by linux-sources, W297)
addopts = "--strict-markers --strict-config"
markers = []

# ⚑⚑ THE SIBLINGS' FULL STRICT BLOCK, unchanged. See ratchet/pyproject.toml for why each key.
[tool.mypy]
strict = true
extra_checks = true
strict_equality = true
disallow_any_decorated = true
disallow_any_explicit = true
disallow_any_expr = true
python_version = "3.13"
warn_unused_ignores = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
files = ["src", "tests"]
# ⚑ `stubs` IS THE THIRD-PARTY SURFACE (as in otlp, treeio and mdstruct): the bazel mypy runner
# cannot see runtime dependencies, so the slice of Playwright the browser tests use is declared there.
mypy_path = "src:stubs"
explicit_package_bases = true

[tool.ruff]
line-length = 100
target-version = "py313"
namespace-packages = ["src/mikemol", "tests"]

[tool.ruff.lint]
preview = true
select = ["ALL"]
ignore = [
    "incorrect-blank-line-before-class",
    "multi-line-summary-second-line",
    "missing-trailing-comma",
    # ⚑ CODON REJECTS A BARE `*,` (mtools:W1340): the keyword-only marker that kept a boolean out of
    # the positional slot is gone, so the rules that demand it are off for this dist.
    "boolean-type-hint-positional-argument",
    "boolean-default-value-positional-argument",
]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = true

# ⚑⚑ COPIED FROM ratchet/pyproject.toml, which carries the P/F arms this pattern was measured by.
# A TOML literal string: in a basic string `\.` is an invalid escape.
[tool.ruff.lint.flake8-copyright]
notice-rgx = '(?i)SPDX-License-Identifier: Apache-2\.0[ \t]*\n#[ \t]*Copyright \(c\) \d{4} Mike Mol'

# ⚑⚑ PER FILE, NEVER A GLOB. A `tests/*` entry would grant the next test module an exemption
# nobody chose for it; each line below is one module that needs it.
[tool.ruff.lint.per-file-ignores]
"tests/test_smoke.py" = ["assert"]
"tests/test_waits.py" = ["assert"]
"tests/test_adopt.py" = ["assert"]
"tests/test_page.py" = ["assert"]
# ⚑ THE ONE MODULE THAT STARTS A PROCESS (W1819): it launches the pinned browser from bazel's own
# data with a fixed argv and no shell, so the two subprocess rules are exempted for it and no other.
"tests/test_chromium.py" = [
    "assert",
    "suspicious-subprocess-import",
    "subprocess-without-shell-equals-true",
]
# ⚑ THE BROWSER PROBES (W1820): the same two exemptions for the same reason (the second process is
# `cdp_poke.py` run with this interpreter and a port, no shell), and the helper that starts it.
"tests/test_browser.py" = [
    "assert",
    "suspicious-subprocess-import",
    "subprocess-without-shell-equals-true",
]
