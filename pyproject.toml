#
# ⚑⚑⚑ THE ROOT IS NOT A DISTRIBUTION, AND THIS FILE CARRIES NO `[project]` FOR THAT REASON. It
# exists so the root scripts — the mutation runner, the pytest shim, the mypy wrapper, the BEP
# probe, the test counter and the runner's own tests — meet the same bar as every distribution. Before it,
# no configuration reached them: each distribution's `pyproject.toml` stops at its own directory,
# so ruff fell back to its defaults and mypy was never run at all.
# ⚑⚑ AND THE GATE'S POPULATION IS UNCHANGED BY IT — BUT ONLY BECAUSE A SYMLINK IS NOT A
# DISTRIBUTION. `_dists` is derived from `*/pyproject.toml`. This file does not match that glob
# itself, but bazel's convenience link `bazel-mtools` mirrors the root, so `bazel-mtools/
# pyproject.toml` DID match the moment this file existed: measured, preflight saw a sixth
# "distribution" and 1,653 collection errors. The gate, preflight and the hooks tests now skip any
# symlinked directory. The root's checks are the `//:ruff` and `//:mypy` targets beside it, which
# `bazel test //...` already runs.

[tool.mypy]
strict = true
extra_checks = true
strict_equality = true
disallow_any_decorated = true
disallow_any_explicit = true
disallow_any_expr = true
python_version = "3.13"
warn_unused_ignores = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
# ⚑ A GLOB OVER THE ROOT'S OWN LEVEL, NOT `.` AND NOT A LIST. `.` would recurse into every
# distribution under a config that is not theirs; a hand list would miss the next root script on
# the day it lands — the drift `BUILD.bazel` records three times for its own root populations.
files = ["*.py"]
# ⚑⚑⚑ THE ROOT SCRIPTS ARE TOP-LEVEL MODULES, AND WITHOUT THIS MYPY CLIMBS OUT OF THE CHECKOUT TO
# NAME THEM. No base declared means mypy crawls up the directory tree deriving a package name for
# each file; under bazel the checkout is `mypy.runfiles/_main`, and rules_python writes an empty
# `__init__.py` at the runfiles ROOT. MEASURED: `//:mypy` refused with *"mypy.runfiles contains
# __init__.py but is not a valid Python package name"* — the crawl reached a directory the
# repository does not have. Deleting markers from `_main` did not help, because the one that
# stopped it sat ABOVE `_main`. The distributions never hit this: they declare
# `explicit_package_bases` with `mypy_path = "src"`, so their crawl ends at a declared root.
# ⚑ With no `mypy_path`, the declared base is the directory mypy runs in — which is exactly the
# claim: `mutate_runner.py` is module `mutate_runner`, and `test_mutate_runner` imports it so.
explicit_package_bases = true
# ⚑ THE FENCE SIBLING EDGE (mtools:W619): `mutate_runner` imports `mikemol.fence.git_env`, so mypy
# reads fence's source root, a directory of this checkout. ⚑ AND THE MUTATION ONE (mtools:W629): it
# imports `mikemol.mutation.declarations` the same way, so the two roots are listed together.
mypy_path = "fence/src:mutation/src"

[tool.ruff]
line-length = 100
target-version = "py313"
# ⚑ THE ROOT'S RUFF STOPS AT THE ROOT. Each distribution already has its own config, and ruff picks
# the nearest one per file, so this line matters only for directories that carry none.
extend-exclude = ["bazel-*", "inbox", "findings", "patches", "rbe", ".claude"]
# ⚑ rules_py/ IS THE ROOT OF ITS OWN BAZEL MODULE (`mikemol_rules_py`, W323), so its
# `pytest_main.py` is a top-level script there, not a member of a package missing its __init__.py.
# DECLARED, as the distributions declare theirs (INP001 is answered by namespace-packages, never
# ignored). It leaves with the atom when the atom moves to its own repo.
# ⚑⚑ W485: EACH ATOM TWICE — ONCE WHERE A DEVELOPER READS IT, ONCE WHERE `//:ruff` READS IT. In
# the test's runfiles an external module's files sit at `../<canonical name>/`, a sibling of
# `_main`, so the checkout spelling matches nothing there; measured, INP001 on every atom file
# under `//:ruff` and on none of them on the host. The staged spelling is bzlmod's canonical
# repository name: if bazel renames it, `//:ruff` goes RED on INP001, never silently green.
namespace-packages = [
    "rules_py",
    "check_mypy",
    "check_mutants",
    "check_ruff",
    "check_ratchet",
    "../mikemol_rules_py+",
    "../mikemol_check_mypy+",
    "../mikemol_check_mutants+",
    "../mikemol_check_ruff+",
    "../mikemol_check_ratchet+",
]

[tool.ruff.lint]
preview = true
select = ["ALL"]
ignore = [
    "incorrect-blank-line-before-class",
    "multi-line-summary-second-line",
    "missing-trailing-comma",
]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = true

[tool.ruff.lint.flake8-copyright]
notice-rgx = '(?i)SPDX-License-Identifier: Apache-2\.0[ \t]*\n#[ \t]*Copyright \(c\) \d{4} Mike Mol'

[tool.ruff.lint.per-file-ignores]
# ⚑ RELIEF IS PER FILE AND PER RESPONSIBILITY, the shape `ratchet/pyproject.toml` records: an entry
# naming a directory would grant it to every script in order to cover one call.
#
# ⚑ RUNNING A SUITE IS THE MUTATION RUNNER'S WHOLE JOB. Its one subprocess is `launch`: an argv
# list, no shell, an interpreter path the caller supplies and a fixed pytest command line.
"mutate_runner.py" = [
    "subprocess-without-shell-equals-true",
    "suspicious-subprocess-import",
]
# ⚑ ASKING LUTHEN'S ENDPOINT DIRECTORY IS HALF OF THE BEP PROBE'S JOB (the address is asked for at
# probe time, never written here — its docstring says why). A fixed argv into a sibling checkout.
"bep_probe.py" = [
    "subprocess-without-shell-equals-true",
    "suspicious-subprocess-import",
]
# ⚑ RUNNING THE VENV IS THE VENV CHECK'S WHOLE JOB (W341): it starts the interpreter, imports the
# package, and runs each console script through /bin/sh, with argv lists built from paths.
"venv_check.py" = [
    "subprocess-without-shell-equals-true",
    "suspicious-subprocess-import",
]
# ⚑ ITS TEST ASSERTS, and builds venvs from the interpreter running it; no subprocess of its own.
"test_venv_check.py" = ["assert"]
# ⚑ ITS TEST ASSERTS (W233), over requirements files and locks it writes into tmp_path.
"test_reqs_check.py" = ["assert"]
# ⚑⚑ W485: THE ENTRIES BELOW ARRIVED WHEN `//:ruff` FIRST READ THE ATOMS IT WAS PASSED. Before,
# it ran over `.` in `_main` and never opened an external module's file.
# ⚑ ITS TEST ASSERTS (W362, W363), over BUILD and test files it writes into tmp_path.
"test_suite_check.py" = ["assert"]
# ⚑ ITS TEST ASSERTS (W503), over test modules it writes into tmp_path.
"test_vacuity_floor.py" = ["assert"]
# ⚑ RUNNING THE RATCHET IS THE REFUSAL CHECK'S WHOLE JOB (W388): one argv list, no shell, the
# ratchet path the gate passes and a temporary copy of the distribution.
"refusal_check.py" = [
    "subprocess-without-shell-equals-true",
    "suspicious-subprocess-import",
]
# ⚑ ITS TEST ASSERTS, over a fake ratchet; no subprocess of its own.
"test_refusal_check.py" = ["assert"]
# ⚑ RUNNING RUFF IS THE SELECTOR CHECK'S WHOLE JOB (W384): the declared ruff, an argv list, no shell.
"selector_check.py" = [
    "subprocess-without-shell-equals-true",
    "suspicious-subprocess-import",
]
# ⚑ ITS TEST ASSERTS, over hand-written configs and a fake ruff.
"test_selector_check.py" = ["assert"]
# ⚑ RUNNING THE ENGINE IS THE PAPERKIT GATE'S WHOLE JOB (W843): one argv list, no shell, the
# interpreter running it and the engine path the bazel rule names.
"paperkit_gate_main.py" = [
    "subprocess-without-shell-equals-true",
    "suspicious-subprocess-import",
]
# ⚑ RUNNING RUFF IS THE SUPPRESSION CHECK'S WHOLE JOB (W385): the declared ruff, an argv list.
"suppression_check.py" = [
    "subprocess-without-shell-equals-true",
    "suspicious-subprocess-import",
]
# ⚑ ITS TEST ASSERTS, over planted directives and the gate's ruff.
"test_suppression_check.py" = ["assert"]
# ⚑ A TEST MODULE ASSERTS; that is what pytest reads. And its GIT_* witness builds a real decoy
# repository, because the hazard under test is git following an exported GIT_DIR — `git` is
# resolved from PATH as `ratchet/tests/test_remap.py` resolves it, for the same reason.
"test_mutate_runner.py" = [
    "assert",
    "subprocess-without-shell-equals-true",
    "suspicious-subprocess-import",
    "start-process-with-partial-path",
]
