[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# ⚑ THE GRADE LADDER, moved from paperkit's engine module `grade.py` (mtools:W557, umbrella
# mtools:W531, survey mtools:W552 section 2.3). Pure data plus pure functions, standard library
# only; the bib scopes constant it used to read lazily from paperkit's `bib` now lives here.
name = "mikemol-grade"
version = "0.1.0"
description = "The falsifiability grade ladder: rungs, clamp by entailment, and how a flip-set becomes a grade."
readme = "README.md"
requires-python = ">=3.13"
authors = [{name = "Mike Mol"}]
license = "Apache-2.0"
keywords = ["grade", "falsifiability", "mutation", "ladder"]
classifiers = [
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

# ⚑ NO RUNTIME DEPENDENCY, and no script: this is a library.
dependencies = []

[project.urls]
Homepage = "https://github.com/mikemol/mtools"

[dependency-groups]
# ⚑ THE SAME THREE AS THE SIBLINGS (see ratchet/pyproject.toml).
dev = ["pytest", "mypy", "ruff==0.16.6"]

[tool.setuptools.packages.find]
where = ["src"]
# ⚑⚑ NO `src/mikemol/__init__.py`: PEP 420 implicit namespace, shared with the siblings.
include = ["mikemol.*"]

[tool.setuptools.package-data]
"mikemol.grade" = ["py.typed"]

[tool.uv]
environments = ["sys_platform == 'linux'"]

[tool.pytest.ini_options]
empty_parameter_set_mark = "fail_at_collect"  # a parametrize that collects zero cases FAILS; it never reads as a skip (W88, arms in W90)
testpaths = ["tests"]
norecursedirs = ["bazel-*", ".venv", ".git", ".claude", "*.egg-info", "__pycache__"]  # backstop: with tests/ absent the runner falls back to rootdir and walks these (measured by linux-sources, W297)
addopts = "--strict-markers --strict-config"
markers = []

# ⚑⚑ THE SIBLINGS' FULL STRICT BLOCK, unchanged. See ratchet/pyproject.toml for why each key.
[tool.mypy]
strict = true
extra_checks = true
strict_equality = true
disallow_any_decorated = true
disallow_any_explicit = true
disallow_any_expr = true
python_version = "3.13"
warn_unused_ignores = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
files = ["src", "tests"]
mypy_path = "src"
explicit_package_bases = true

[tool.ruff]
line-length = 100
target-version = "py313"
namespace-packages = ["src/mikemol", "tests"]

[tool.ruff.lint]
preview = true
select = ["ALL"]
ignore = ["incorrect-blank-line-before-class", "multi-line-summary-second-line", "missing-trailing-comma"]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = true

# ⚑⚑ COPIED FROM ratchet/pyproject.toml, which carries the P/F arms this pattern was measured by.
# A TOML literal string: in a basic string `\.` is an invalid escape.
[tool.ruff.lint.flake8-copyright]
notice-rgx = '(?i)SPDX-License-Identifier: Apache-2\.0[ \t]*\n#[ \t]*Copyright \(c\) \d{4} Mike Mol'

# ⚑⚑ PER FILE, NEVER A GLOB. A `tests/*` entry would grant the next test module an exemption
# nobody chose for it; each line below is one module that needs it.
[tool.ruff.lint.per-file-ignores]
# boolean-type-hint-positional-argument and boolean-default-value-positional-argument:
# `rungs(descending)`, `grade_from_sens(baseline, ..., reachable)` and `_rank`-style boolean
# parameters are positional in paperkit's callers (`grade_from_sens(False, [], reachable=True)`);
# keeping the signature is the port's contract.
"src/mikemol/grade/grade.py" = ["boolean-type-hint-positional-argument", "boolean-default-value-positional-argument"]
"tests/test_ladder.py" = ["assert"]
"tests/test_clamp.py" = ["assert"]
"tests/test_verify.py" = ["assert"]
