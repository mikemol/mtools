#
# The house mypy config for this atom's scripts (W388), copied from check_ruff's mypy.ini.
# ⚑ mypy.ini, NOT pyproject.toml: the gates find distributions by `*/pyproject.toml`, and an atom
# is not one.
[mypy]
strict = True
extra_checks = True
strict_equality = True
disallow_any_decorated = True
disallow_any_explicit = True
disallow_any_expr = True
python_version = 3.13
warn_unused_ignores = True
warn_unreachable = True
enable_error_code = ignore-without-code, redundant-expr, truthy-bool
files = refusal_check.py, test_refusal_check.py
explicit_package_bases = True
